<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>aLoN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #FAF7F0;
    --white: #FFFFFF;
    --tint: #E8EFFB;
    --field-line: #D5DFEE;
    --line: #E3E8EE;
    --chip-line: #BFCDE3;
    --royal: #1659D0;
    --navy: #0E2440;
    --muted: #4A5A6B;
    --muted-2: #3E5068;
    --amber-bg: #F6EBD3;
    --amber-line: #E8D3A6;
    --amber-text: #7A4F0F;
    --amber-body: #5A4520;
    --amber-dot: #C98A1E;
    --est: #5A6472;
    --est-dot: #7C8794;
    --ok-dot: #2E8A6A;
    --backdrop: #D6E2F3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--backdrop); font-family: 'Manrope', system-ui, -apple-system, sans-serif; color: var(--navy); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, input { font-family: inherit; color: inherit; }
  a { color: var(--royal); }

  body { height: 100vh; height: 100dvh; overflow: hidden; }
  .phone { position: relative; width: 100%; max-width: 430px; height: 100%; margin: 0 auto; background: var(--ivory); display: flex; flex-direction: column; overflow: hidden; }
  .phone.wide { max-width: min(880px, calc(100vw - 32px)); }
  .scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; scrollbar-width: none; }
  .scroller::-webkit-scrollbar { display: none; }
  @media (min-width: 520px) {
    body { padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
    .phone { flex: 1 1 auto; min-height: 0; height: auto; max-height: 920px; border-radius: 40px; box-shadow: 0 1px 2px rgba(14,36,64,.08), 0 20px 60px rgba(14,36,64,.12); }
  }
  .demo-tag { text-align: center; font-size: 12px; color: var(--muted); padding: 0 0 10px; margin: 0; flex: none; }
  @media (max-width: 519px) { .demo-tag { display: none; } }
  main { flex: 1; display: flex; flex-direction: column; padding-bottom: 24px; }

  .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px 6px; position: relative; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .back { display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 16px; font-weight: 600; background: none; border: 0; padding: 0; cursor: pointer; color: var(--royal); }
  .dots { width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--field-line); background: var(--white); display: grid; grid-template-columns: repeat(2, 6px); gap: 6px; place-content: center; cursor: pointer; padding: 0; }
  .dots span { width: 6px; height: 6px; border-radius: 3px; background: var(--royal); }
  .menu { position: absolute; top: 64px; right: 24px; z-index: 20; background: var(--white); border: 1px solid var(--line); border-radius: 20px; padding: 8px; min-width: 230px; box-shadow: 0 12px 40px rgba(14,36,64,.14); display: flex; flex-direction: column; }
  .menu button { text-align: left; background: none; border: 0; padding: 14px 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .menu button:hover { background: var(--tint); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 8px; }
  .menu .quiet { font-size: 14px; color: var(--muted); }

  .pad { padding-left: 24px; padding-right: 24px; }
  .eyebrow { font-size: 14px; font-weight: 600; color: var(--muted); }
  .h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
  .h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .hero { font-size: 76px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .hero.range { font-size: 50px; }
  .hero.short { color: var(--amber-text); }
  .body { font-size: 15px; color: var(--muted); line-height: 1.5; margin: 0; }
  .small { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0; }

  .card { background: var(--white); border: 1px solid var(--line); border-radius: 22px; padding: 16px; }
  .tint { background: var(--tint); border-radius: 20px; padding: 16px; }
  .warn { background: var(--amber-bg); border: 1px solid var(--amber-line); border-radius: 20px; padding: 16px; }
  .stack { display: flex; flex-direction: column; }
  .gap4 { gap: 4px; } .gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap12 { gap: 12px; } .gap14 { gap: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mt8 { margin-top: 8px; } .mt10 { margin-top: 10px; } .mt14 { margin-top: 14px; } .mt20 { margin-top: 20px; } .mt24 { margin-top: 24px; } .mt28 { margin-top: 28px; }
  .tap { width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .linkish { font-size: 14px; font-weight: 700; color: var(--royal); background: none; border: 0; padding: 6px 0; cursor: pointer; }

  .bar { height: 12px; border-radius: 6px; background: var(--tint); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 6px; background: var(--royal); }
  .bar.thin { height: 8px; }
  .bar.amber { background: #EBD9B4; } .bar.amber > div { background: var(--amber-dot); }

  .dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; flex-shrink: 0; }
  .dot.ok { background: var(--ok-dot); }
  .dot.warn { background: var(--amber-dot); padding: 0; border: 0; border-radius: 4px; }   /* not the .warn card */
  .dot.est { border: 2px solid var(--est-dot); }
  .dot.range { background: linear-gradient(90deg, var(--royal) 50%, var(--tint) 50%); border: 1px solid var(--royal); }

  .line-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); background: none; }
  .line-item:last-child { border-bottom: 0; }
  .line-item .name { font-size: 16px; font-weight: 600; display: block; }
  .line-item .meta { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .line-item .meta.warn-t { color: var(--amber-text); }
  .line-item .meta.est-t { color: var(--est); }
  .line-item .amt { font-size: 17px; font-weight: 700; white-space: nowrap; }
  .line-item .amt.est-t { color: var(--est); }

  .chip { min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--chip-line); background: var(--white); color: var(--royal); font-size: 15px; font-weight: 600; cursor: pointer; }
  .chip.on { border-color: var(--royal); background: var(--royal); color: var(--white); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }

  .primary { min-height: 54px; border-radius: 999px; border: 0; background: var(--royal); color: var(--white); font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; }
  .primary:disabled { background: #9DB5DE; cursor: default; }
  .secondary { min-height: 48px; border-radius: 999px; border: 1px solid var(--chip-line); background: var(--white); color: var(--royal); font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .legend { font-size: 14px; font-weight: 600; color: var(--muted); }
  .input { min-height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--field-line); background: var(--white); font-size: 17px; width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; color: var(--navy); font-family: inherit; }
  /* dates look like every other field (iPhone draws them centered and wider by default) */
  .input[type="date"] { -webkit-appearance: none; appearance: none; display: block; text-align: left; line-height: 50px; height: 52px; }
  .input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  .input[type="date"]::-webkit-calendar-picker-indicator { opacity: .55; }
  select.input { -webkit-appearance: none; appearance: none; }
  .preview-card .body { color: var(--navy); margin: 0; }
  .preview-card .ph { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .more-toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 48px; padding: 0 16px; border-radius: 16px; border: 1px dashed var(--chip-line); background: transparent; color: var(--royal); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; text-align: left; }
  .more-toggle .sum { font-size: 13px; font-weight: 500; color: var(--muted); }
  .input:focus, .money input:focus { outline: 2px solid var(--royal); outline-offset: 1px; }
  .money { display: flex; align-items: center; gap: 4px; padding: 8px 18px; border-radius: 20px; background: var(--white); border: 1px solid var(--field-line); }
  .money span { font-size: 40px; font-weight: 800; color: var(--muted); }
  .money input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 40px; font-weight: 800; outline: none; border-radius: 8px; }
  .seg { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; padding: 4px; border-radius: 999px; background: var(--tint); }
  .seg button { min-height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--muted-2); font-size: 15px; font-weight: 700; cursor: pointer; }
  .seg button.on { background: var(--white); color: var(--navy); box-shadow: 0 1px 2px rgba(14,36,64,.12); }

  .option { display: flex; gap: 12px; padding: 16px; border-radius: 18px; background: var(--white); border: 1px solid var(--field-line); }
  .option.on { border: 2px solid var(--royal); padding: 15px; }
  .radio { width: 22px; height: 22px; border-radius: 11px; border: 2px solid #8A9BB8; flex-shrink: 0; display: grid; place-items: center; }
  .option.on .radio { border-color: var(--royal); }
  .option.on .radio::after { content: ""; width: 10px; height: 10px; border-radius: 5px; background: var(--royal); }
  .option .t { font-size: 16px; font-weight: 700; display: block; }
  .option .d { font-size: 14px; color: var(--muted); line-height: 1.45; margin-top: 4px; display: block; }

  .decision { font-size: 20px; font-weight: 800; color: var(--royal); }

  .wave-labels { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); text-align: center; font-size: 12px; gap: 2px; }
  .wave-labels button { background: none; border: 0; padding: 4px 0; cursor: pointer; display: flex; flex-direction: column; gap: 1px; align-items: center; border-radius: 10px; }
  .wave-labels button:hover { background: var(--tint); }
  .wave-labels .d { color: #475768; }
  .wave-scroll { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin: 0 -4px; padding: 14px 4px 0; overscroll-behavior-x: contain; }
  .wave-scroll.more { -webkit-mask-image: linear-gradient(90deg, #000 95%, transparent); mask-image: linear-gradient(90deg, #000 95%, transparent); }
  .pc-arrow[aria-disabled="true"] { opacity: .35; cursor: default; }
  .wave-scroll::-webkit-scrollbar { display: none; }
  .wave-strip { position: relative; }
  .wave-hit { cursor: pointer; }
  .wave-strip .wave-labels button { scroll-snap-align: start; }
  .wave-labels .far .d, .wave-labels .far strong { color: #7C8794; }
  .wave-labels .x { font-size: 10.5px; font-weight: 800; color: var(--royal); background: var(--tint); border-radius: 6px; padding: 1px 5px; margin-top: 2px; }
  .wave-labels .t { color: #475768; font-size: 10.5px; white-space: nowrap; letter-spacing: -.01em; }
  .wave-labels strong.short { color: var(--amber-text); }
  .pc-track { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 2px 2px 8px; margin: 0 -2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .pc-track::-webkit-scrollbar { display: none; }
  .pc-track::after { content: ''; flex: 0 0 calc(38% - 10px); }   /* room for the last card to come fully into view */
  .pc-card { flex: 0 0 62%; min-width: 0; scroll-snap-align: start; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--white); color: var(--navy); font: inherit; cursor: pointer; }
  .pc-card.short { background: var(--amber-bg); border-color: var(--amber-line); }
  .pc-date { font-size: 13px; font-weight: 700; color: var(--muted-2); }
  .pc-room { font-size: 24px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
  .pc-card.short .pc-room { color: var(--amber-text); }
  .pc-sub { font-size: 13px; color: var(--muted); }
  .pc-sub em { font-style: normal; font-weight: 700; color: var(--muted-2); white-space: nowrap; }
  .pc-badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .pc-badge { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--tint); color: var(--royal); }
  .pc-badge.warm { background: #FBEBD0; color: var(--amber-text); }
  .pc-badge.plain { background: #EEF1F5; color: var(--muted-2); }
  .pc-items { display: flex; flex-direction: column; gap: 4px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
  .pc-items .row span:last-child { font-variant-numeric: tabular-nums; }
  .pc-tag { margin-top: 4px; font-size: 12px; font-weight: 700; line-height: 1.3; padding: 4px 8px; border-radius: 8px; background: var(--tint); color: var(--royal); align-self: flex-start; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pc-tag.warm { background: #FBEBD0; color: var(--amber-text); }
  .pc-tag.plain, .pc-tag.bill { background: #EEF1F5; color: var(--muted-2); }
  .pc-more { font-weight: 800; opacity: .75; }
  .pc-nav { display: flex; align-items: center; gap: 4px; }
  .pc-arrow { width: 44px; height: 44px; margin: -6px -4px; border: 0; background: none; display: grid; place-items: center; color: var(--royal); cursor: pointer; border-radius: 50%; }
  .pc-arrow svg { width: 32px; height: 32px; padding: 7px; border-radius: 50%; border: 1px solid var(--chip-line); background: var(--white); box-sizing: border-box; }
  .legend-row { display: flex; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }
  .legend-row span { display: flex; align-items: center; gap: 6px; }

  .dock { position: sticky; bottom: 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); background: var(--ivory); display: flex; flex-direction: column; gap: 10px; border-top: 1px solid rgba(213,223,238,.7); z-index: 5; }
  .ask { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px; border-radius: 999px; background: var(--tint); margin: 0; }
  .ask input { flex: 1; border: 0; background: transparent; font-size: 16px; outline: none; min-width: 0; }
  .send { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--royal); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }

  .why-sheet { max-height: 88vh; overflow-y: auto; gap: 12px; padding-top: 10px; overscroll-behavior: contain; }
  .why-sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #C9D6EC; align-self: center; margin-bottom: 4px; flex: none; }
  .why-main { background: var(--white); border: 1px solid var(--line); border-left: 4px solid var(--amber-dot); border-radius: 16px; padding: 14px 16px; }
  .why-main .k, .why-note .k, .why-teach .k { display: block; font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .why-main p { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.4; }
  .why-main .why-normal { margin-top: 6px; font-size: 14px; font-weight: 500; color: var(--muted-2); line-height: 1.5; }
  .receipt { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; }
  .rc-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 15px; border-bottom: 1px dashed var(--line); }
  .rc-row > span:last-child { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rc-sub { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; margin-top: 2px; line-height: 1.35; }
  .rc-driver > span:first-child { font-weight: 700; }
  .rc-driver > span:last-child { color: var(--amber-text); }
  .rc-about { font-size: 12px; font-weight: 600; color: var(--muted); }
  .rc-row.rc-sub-total { font-weight: 700; border-bottom-style: solid; }
  .rc-total { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0 10px; font-size: 17px; font-weight: 800; }
  .rc-total.short { color: var(--amber-text); }
  .why-note p { margin: 0; font-size: 14.5px; line-height: 1.5; }
  .why-note p + p { margin-top: 6px; }
  .why-teach { border: 1px solid #C9D6EC; border-radius: 16px; padding: 14px 16px; background: #F5F8FE; display: flex; flex-direction: column; gap: 10px; }
  .why-teach p { margin: 0; font-size: 14.5px; line-height: 1.5; }
  .why-btn { min-height: 46px; font-size: 14.5px; line-height: 1.3; padding: 8px 16px; }
  .why-conf { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--muted-2); line-height: 1.45; }
  .why-conf .dotc { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex: none; background: var(--ok-dot); }
  .why-conf.some .dotc { background: var(--est-dot); }
  .why-conf.early .dotc { background: transparent; border: 2px solid var(--est-dot); }
  .why-opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; background: var(--white); border: 1px solid var(--field-line); border-radius: 16px; padding: 12px 14px; min-height: 56px; width: 100%; cursor: pointer; font: inherit; color: var(--navy); }
  .why-opt .t { display: block; font-size: 15.5px; font-weight: 700; }
  .why-opt .d { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .why-line { font-size: 14px; line-height: 1.45; color: var(--amber-body); }
  .why-card .see { font-weight: 700; color: #6E4710; white-space: nowrap; }
  .term { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; text-decoration: underline dotted 1.5px; text-decoration-color: #7C9FDB; text-underline-offset: 3px; cursor: help; }
  .term-body p { margin: 0 0 10px; font-size: 15px; line-height: 1.55; }
  .term-body .you { background: var(--tint); border-radius: 12px; padding: 10px 12px; }
  .ask-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .ask-chips::-webkit-scrollbar { display: none; }
  .ask-chip { flex: none; min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--chip-line); background: var(--white); color: var(--royal); font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .tour { position: absolute; inset: 0; z-index: 45; }
  .tour-ring { position: absolute; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(14,36,64,.5); border: 2px solid #fff; pointer-events: none; transition: all .22s ease-out; }
  .tour-bubble { position: absolute; left: 16px; right: 16px; background: #fff; border-radius: 20px; padding: 16px 18px; box-shadow: 0 16px 40px rgba(14,36,64,.3); display: flex; flex-direction: column; gap: 6px; }
  .tour-bubble p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted-2); }
  .tour-step { font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--royal); }
  .tour-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .tour-nav > span { display: flex; gap: 8px; }
  .tour-btn { min-height: 42px; width: auto; padding: 0 18px; font-size: 15px; }
  @media (prefers-reduced-motion: reduce) { .tour-ring { transition: none; } }
  .when-chips .chip { min-height: 36px; padding: 0 12px; font-size: 13.5px; }
  .checkin { display: flex; flex-direction: column; gap: 8px; }
  .checkin-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .checkin-head .linkish { font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--muted-2); font-weight: 600; padding: 4px 0; }
  .ok-state { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 20px; background: var(--white); border: 1px solid var(--line); }
  .ok-ic { width: 26px; height: 26px; border-radius: 50%; background: var(--ok-dot); display: grid; place-items: center; flex: none; }

/* The day a bill's occurrence actually comes out (after any "Not yet, moved to…"). */
const occDate = (b, orig, part) => { const m = (b.moved || {})[payKey(orig, part || 0)]; return m ? parse(m) : orig; };

/* Money set aside, as dated events: when it's set aside (reserve) and when it's let go to pay for what
   it was for (release). Prepared money and Spread set-asides belong to one bill and are let go on that
   bill's day; goals and the tide pool stay set aside until drawn on. */
function reservedEvents(from, until) {
  const ev = [], existing = [];
  const add = (date, amount, name, kind, extra) => { if (amount > 0) ev.push(Object.assign({ date: iso(date), dir: kind, name, amount }, extra || {})); };
  state.bills.forEach(b => {
    const pl = preparedLeft(b); if (!pl) return;
    const d = occDate(b, pl.date, 0);
    existing.push({ name: `Set aside for ${b.name}`, amount: pl.prepared });
    if (d >= from && d < until) add(d, Math.min(pl.prepared, b.amount), `Set aside for ${b.name}`, 'release', { billId: b.id });
  });
  (state.reserves || []).filter(r => r.done !== false && r.bill).forEach(r => {
    const b = state.bills.find(x => x.id === r.bill); if (!b) return;
    const to = parse(r.to), x = billEvents(b, to, addDays(to, 45))[0], due = x ? x.date : to;
    if (due < from) return;
    if (parse(r.from) < from) existing.push({ name: `Set aside for ${b.name}`, amount: r.amount });
    else if (parse(r.from) < until) add(parse(r.from), r.amount, `Set aside for ${b.name}`, 'reserve', { billId: b.id });
    if (due < until) add(due, r.amount, `Set aside for ${b.name}`, 'release', { billId: b.id });
  });
  (state.goals || []).forEach(g => {
    if (g.saved > 0) existing.push({ name: g.name, amount: g.saved });
    const gp = goalPlan(g);
    Object.keys(gp.map).forEach(k => { const t = parse(k); if (t >= from && t < until && !(k in (g.hist || {}))) add(t, gp.map[k], `Toward ${g.name}`, 'reserve'); });
  });
  (state.draws || []).forEach(d => { const t = parse(d.date); if (t >= from && t < until) add(t, d.amount, `From ${d.name || 'savings'}`, 'release', { draw: true }); });
  // set some aside when it arrives (taxes, the property, the business); a bill marked "paid from it" uses it
  const kept = {};
  state.sources.forEach(s => { const k = keepOf(s); if (!k) return;
    incomeDates(s, from, until).forEach(t => { if (!sourceActive(s, t)) return;
      const a = state.actuals[s.id + '|' + t], amt = a != null ? a : (s.certainty === 'uncertain' ? 0 : s.low), kc = keptFrom(s, amt);
      if (kc > 0) (kept[k.label] = kept[k.label] || []).push({ t, amt: kc, src: s }); }); });
  const keepBills = state.bills.filter(b => b.fromKeep);
  Object.keys(kept).concat(keepBills.map(b => b.fromKeep)).filter((l, i, a) => a.indexOf(l) === i).forEach(label => {
    const ins = (kept[label] || []).map(x => ({ t: x.t, d: 'in', amt: x.amt, src: x.src }));
    const outs = [].concat(...keepBills.filter(b => b.fromKeep === label).map(b => billEvents(b, from, until).map(x => ({ t: x.date, d: 'out', amt: x.amount, b }))));
    let run = Math.max(0, Number((state.keptSoFar || {})[label]) || 0);
    if (run > 0) existing.push({ name: `Set aside for ${keepWord(label)}`, amount: run });
    ins.concat(outs).sort((a, c) => a.t - c.t || (a.d === 'in' ? -1 : 1)).forEach(e => {
      if (e.d === 'in') { add(e.t, e.amt, `Set aside for ${keepWord(label)}`, 'reserve', { keep: e.src.id, keepFor: label }); run += e.amt; }
      else { const r = Math.min(run, e.amt); if (r > 0) { add(e.t, r, `Set aside for ${keepWord(label)}`, 'release', { billId: e.b.id, keepFor: label }); run -= r; } }
    });
  });
  const pool = state.pool || {};
  if (pool.balance > 0) existing.push({ name: 'Tide pool', amount: Number(pool.balance) });
  (pool.adds || []).filter(a => a.done == null).forEach(a => { const t = parse(a.from); if (t >= from && t < until) add(t, a.amount, 'Tide pool', 'reserve'); });
  return { ev, existing, existingC: centsSum(existing, x => x.amount) };
}

/* F1. A bill belongs to the paycheck whose span (its payday up to the next payday) holds the bill's due
   date, paid or not: paying it only records what happened. Money set aside earlier for those bills
   covers part of them; money set aside from this paycheck for later is committed. Everyday spending
   is a separate, estimated layer (R2). */
function paycheckRemainders(count) {
  const days = paycheckDates(count), prim = primarySource(), out = [];
  for (let k = 0; k + 1 < days.length; k++) {
    const start = days[k], end = days[k + 1];
    const deposits = [];
    state.sources.forEach(s => incomeDates(s === prim ? projectedRule(s) : s, start, end).forEach(t => {
      if (!sourceActive(s, t)) return;
      const a = state.actuals[s.id + '|' + t];
      deposits.push({ name: s.name, date: iso(t), amount: a != null ? a : (s.certainty === 'uncertain' ? 0 : s.low), typical: a != null ? a : s.typical, main: s === prim && t === start });
    }));
    const obligations = [];
    state.bills.forEach(b => billEvents(b, start, end).forEach(x => obligations.push({
      name: eventName(x), billId: b.id, date: iso(x.date), amount: x.amount,
      part: x.part || 0, parts: x.parts || 0, paid: x.orig != null && !!(b.paid || {})[payKey(x.orig, x.part)], dateRange: !!x.range })));
    obligations.sort((a, c) => a.date.localeCompare(c.date) || a.name.localeCompare(c.name));
    const rv = reservedEvents(start, end);
    const coveredEarlier = rv.ev.filter(e => e.dir === 'release' && (e.billId || e.draw)), setAsideHere = rv.ev.filter(e => e.dir === 'reserve' && (parse(e.date) < addDays(start, 1) || e.keep));
    const knownC = centsSum(deposits, x => x.amount) - centsSum(obligations, x => x.amount) + centsSum(coveredEarlier, x => x.amount) - centsSum(setAsideHere, x => x.amount);
    const ed = everydayC(Math.round((end - start) / DAY));
    out.push({ payday: iso(start), nextPayday: iso(end), deposits, obligations, coveredEarlier, setAsideHere,
      depositsTotal: toD(centsSum(deposits, x => x.amount)), obligationsTotal: toD(centsSum(obligations, x => x.amount)),
      remainder: toD(knownC), everyday: ed == null ? null : toD(ed), likely: ed == null ? null : toD(knownC - ed), status: statusFromC(knownC) });
  }
  return out;
}

/* F2. Starts from what the person said is in the account, on the day they said it (onHand, onHandDate).
   cash: the account. reserved: money set aside. spendable: cash − the part of reserved that's in it.
   R1 same day: a bill marked "clears before my deposit" first, then deposits, then set-asides, then bills
   (each bill's own set-aside let go just before it). R3: one question, "Is money you've set aside part of
   that balance?" (reservedInBalance): yes → reserved comes out of spendable; no → it's elsewhere, and
   moving it in or out shows as a transfer. Unknown with money set aside → incomplete. A bill with a
   date range sits whole on its earliest day. Bills already marked paid are already out. */
function projectedBalance(count, opts) {
  const missing = [], uncertain = [];
  const prim = primarySource(), pays = paycheckDates(count);
  // a balance counts from the day it's entered until the next paycheck lands; after that Alon asks again
  const lastPay = pays.length && pays[0] <= TODAY ? pays[0] : null;
  const hasBal = state.onHand != null && !!state.onHandDate && parse(state.onHandDate) <= TODAY && (lastPay == null || parse(state.onHandDate) >= lastPay);
  if (!hasBal) missing.push({ key: 'balance', ask: 'What’s in your account now?' });
  if (!prim) missing.push({ key: 'income', ask: 'When does your next paycheck land, and how much is it?' });
  else if (prim.certainty === 'uncertain' || prim.perWeek) missing.push({ key: 'income', ask: 'When do you expect your next deposit, and about how much?' });
  const asOf = hasBal ? parse(state.onHandDate) : TODAY;
  const until = pays.length ? pays[pays.length - 1] : addDays(TODAY, 14 * (count || WINDOW_COUNT));
  const ev = [];
  state.sources.forEach(s => incomeDates(s === prim ? projectedRule(s) : s, asOf, until).forEach(t => {
    if (!sourceActive(s, t)) return;
    const a = state.actuals[s.id + '|' + t], amt = a != null ? a : (s.certainty === 'uncertain' ? 0 : s.low);
    if (s.certainty === 'uncertain' && a == null) { uncertain.push({ key: 'deposit', name: s.name, date: iso(t) }); return; }
    ev.push({ date: iso(t), dir: 'in', name: s.name, amount: amt, main: s === prim });
  }));
  // a bill with a date range is placed whole on its earliest day, so read past the horizon and keep what starts inside it
  state.bills.forEach(b => billEvents(b, asOf, addDays(until, 31)).filter(x => x.date < until).forEach(x => {
    if (x.orig != null && (b.paid || {})[payKey(x.orig, x.part)]) {
      // paid after the balance was entered: the money came out of that balance, so count it today
      const at = (b.paidAt || {})[payKey(x.orig, x.part)];
      if (!(hasBal && at && at > (state.onHandAt || 0))) return;
      const when = x.date <= TODAY ? (x.date < asOf ? asOf : x.date) : TODAY;
      ev.push({ date: iso(when), dir: 'out', name: eventName(x), billId: b.id, amount: x.amount, paid: true });
      return;
    }
    if (x.range) uncertain.push({ key: 'date', name: b.name, date: iso(x.date), latest: iso(x.range[1]) });
    ev.push({ date: iso(x.date), dir: 'out', name: eventName(x), billId: b.id, amount: x.amount, dateRange: !!x.range, early: !!b.clearsEarly });
  }));
  const rv = reservedEvents(asOf, until);
  ev.push(...rv.ev);
  // opts.assumeReservedIn: count set-aside money as part of the balance until they say (the safer guess)
  const inBal = state.reservedInBalance == null && opts && opts.assumeReservedIn ? true : state.reservedInBalance;
  if (rv.existingC > 0 && state.reservedInBalance == null && !(opts && opts.assumeReservedIn)) missing.push({ key: 'reserved', ask: `Is the ${money(toD(rv.existingC))} you’ve set aside part of the ${hasBal ? money(state.onHand) : 'balance'} in your account?` });
  const rank = e => e.dir === 'out' && e.early ? 0 : e.dir === 'in' ? 1 : e.dir === 'reserve' ? 2 : 3;
  ev.sort((a, c) => a.date.localeCompare(c.date) || rank(a) - rank(c) || (a.billId && a.billId === c.billId ? (a.dir === 'release' ? -1 : 1) : 0) || a.name.localeCompare(c.name));
  const known = hasBal && !(rv.existingC > 0 && inBal == null);
  let cash = hasBal ? toC(state.onHand) : null, res = rv.existingC;
  const spend = () => cash == null ? null : cash - (inBal === false ? 0 : res);
  const accrue = d => everydayC(Math.round((parse(d) - asOf) / DAY));
  const rows = ev.map(e => {
    const a = toC(e.amount);
    if (e.dir === 'in') { if (cash != null) cash += a; }
    else if (e.dir === 'out') { if (cash != null) cash -= a; }
    else if (e.dir === 'reserve') { res += a; if (cash != null && inBal === false) cash -= a; }
    else { const r = Math.min(a, res); res -= r; if (cash != null && inBal === false) cash += r; }
    const sp = known ? spend() : null, ed = sp == null ? null : accrue(e.date);
    return Object.assign({}, e, { cash: known ? toD(cash) : null, reserved: toD(res), spendable: sp == null ? null : toD(sp), likely: ed == null ? null : toD(sp - ed) });
  });
  return { complete: !missing.length, missing, uncertain, asOf: iso(asOf), until: iso(until),
    start: known ? { cash: toD(toC(state.onHand)), reserved: toD(rv.existingC), spendable: toD(spend() == null ? 0 : (toC(state.onHand) - (inBal === false ? 0 : rv.existingC))) } : null,
    reservedNow: rv.existing, reservedInBalance: inBal == null ? null : inBal, rows,
    everydayPerWeek: state.everydayUnknown ? null : (state.everydayPerWeek || 0),
    includes: ['deposits', 'bills', 'money set aside'], estimates: ['everyday spending (likely)'] };
}

/* F3. The first day spendable drops below zero. Its amount is the most it goes below zero before money
   comes in again; the transactions behind it are what went out or was set aside since the last money
   came in, through that low point. A later deposit can bring it back; the shortfall still counts.
   dipsIntoSetAside: the account itself stays above zero, so it's money set aside being used, not an
   overdraft. Unknown stays unknown: an incomplete balance gives 'unknown', never 'none'. */
function projectedShortfall(pb) {
  if (!pb.complete) return { status: 'unknown', missing: pb.missing.map(m => m.key) };
  // the starting point counts too: set-aside money can already be more than what's in the account
  const R = [{ date: pb.asOf, dir: 'start', name: 'Now', amount: 0, cash: pb.start.cash, spendable: pb.start.spendable }].concat(pb.rows), i = R.findIndex(r => r.spendable < 0);
  if (i < 0) return { status: 'none' };
  const goesOut = r => r.dir === 'out' || r.dir === 'reserve' || r.dir === 'release';
  let j = i; while (j > 0 && goesOut(R[j - 1])) j--;
  let k = i, lowC = toC(R[i].spendable), cashLowC = toC(R[i].cash);
  while (k + 1 < R.length && goesOut(R[k + 1])) { k++; lowC = Math.min(lowC, toC(R[k].spendable)); cashLowC = Math.min(cashLowC, toC(R[k].cash)); }
  const behind = R.slice(j, k + 1).filter(r => r.dir === 'out' || r.dir === 'reserve').map(r => ({ name: r.name, date: r.date, amount: r.amount, kind: r.dir === 'out' ? 'bill' : 'set aside' }));
  const back = R.slice(k + 1).find(r => r.spendable >= 0), date = R[i].date;
  return { status: 'short', date, shortBy: toD(-lowC), lowestSpendable: toD(lowC), behind,
    dipsIntoSetAside: cashLowC >= 0,
    recovers: back ? { date: back.date, spendable: back.spendable, by: back.name } : null,
    daysBelowZero: back ? Math.round((parse(back.date) - parse(date)) / DAY) : null };
}

/* F5. The big number: the lowest spendable balance from now until the next paycheck lands (other
   deposits count, but only the main paycheck ends the stretch), and a status from it (R4).
   Without a known balance: this paycheck's remainder, marked as an estimate, and Alon asks. */
function heroFacts(rems, pb) {
  const next = paycheckDates(1).find(t => t > TODAY);
  if (pb.complete && next != null) {
    // what's already happened since the balance was entered sets today's starting point
    const td = iso(TODAY), past = pb.rows.filter(r => r.date < td), last = past[past.length - 1];
    const nowSp = last ? last.spendable : pb.start.spendable, nowLk = last ? last.likely : (everydayC(0) == null ? null : pb.start.spendable);
    const nx = iso(next), before = pb.rows.filter(r => r.date >= td && (r.date < nx || (r.date === nx && r.dir === 'out' && r.early)));
    let lowC = toC(nowSp), likelyC = everydayC(0) == null ? null : toC(nowLk);
    before.forEach(r => { lowC = Math.min(lowC, toC(r.spendable)); if (likelyC != null) likelyC = Math.min(likelyC, toC(r.likely)); });
    if (likelyC != null) {          // everyday spending keeps going until the paycheck lands
      const lastC = before.length ? toC(before[before.length - 1].spendable) : toC(nowSp);
      likelyC = Math.min(likelyC, lastC - everydayC(Math.round((next - parse(pb.asOf)) / DAY)));
    }
    return { basis: 'spendable', until: nx, amount: toD(lowC), likely: likelyC == null ? null : toD(likelyC), status: statusFromC(lowC),
      likelyBelowZero: likelyC != null && lowC >= 0 && likelyC < 0, buffer: toD(bufferC()), estimate: pb.asOf < td || !!pb.assumed, assumed: pb.assumed || null,
      now: { cash: last ? last.cash : pb.start.cash, reserved: last ? last.reserved : pb.start.reserved, spendable: nowSp } };
  }
  const cur = rems.find(r => parse(r.payday) <= TODAY && TODAY < parse(r.nextPayday));
  if (!cur) return { basis: 'unknown', status: 'Unknown', asks: pb.missing.map(m => m.ask) };
  return { basis: 'remainder', until: cur.nextPayday, amount: cur.remainder, likely: cur.likely, status: cur.status,
    likelyBelowZero: cur.likely != null && cur.remainder >= 0 && cur.likely < 0, buffer: toD(bufferC()), estimate: true, asks: pb.missing.map(m => m.ask) };
}

/* No dependable income (Nov 12): the answer is how long what you have lasts. What's available now (cash
   minus set-aside money), and the last day it still covers the bills and everyday spending if no new
   payment comes in. Income that isn't certain is never counted; it shows on the wave as a dashed maybe. */
function runwayFacts(pb) {
  const td = iso(TODAY), asOf = parse(pb.asOf), rows = pb.rows, end = parse(pb.until);
  let k = 0, spC = toC(pb.start.spendable), resC = toC(pb.start.reserved), cash = pb.start.cash;
  while (k < rows.length && rows[k].date < td) { spC = toC(rows[k].spendable); resC = toC(rows[k].reserved); cash = rows[k].cash; k++; }
  const nowC = spC, now = { cash, reserved: toD(resC), spendable: toD(nowC) };
  let through = null, lowC = nowC, likC = null;
  for (let t = TODAY; t < end; t = addDays(t, 1)) {
    const day = iso(t);
    while (k < rows.length && rows[k].date === day) { spC = toC(rows[k].spendable); lowC = Math.min(lowC, spC); k++; }
    const lik = spC - (everydayC(Math.round((t - asOf) / DAY)) || 0);
    likC = likC == null ? lik : Math.min(likC, lik);
    if (lik < 0 && through == null) through = iso(addDays(t, -1));
  }
  const soon = iso(addDays(TODAY, 21));
  return { basis: 'runway', amount: toD(nowC), likely: likC == null ? null : toD(likC), until: through || pb.until, through, past: through ? null : iso(addDays(end, -1)),
    status: nowC < 0 ? 'Short' : through && through < soon ? 'Tight' : 'Covered', buffer: toD(bufferC()), estimate: pb.asOf < td || !!pb.assumed, assumed: pb.assumed || null, now };
}

/* F6. The money state, from the numbers only (never from who someone is). Internal: the screen, the
   rail and Ask Alon change their words with it; the forecast itself doesn't change.
     PRESSURE     the balance (or this paycheck) drops below zero or under the buffer before the next
                  paycheck, or a later paycheck breaks
     STEADY       everything entered is covered through the forecast
     OPPORTUNITY  covered, and free room is meaningful: the lowest likely available balance through the
                  whole forecast, minus the buffer, is at least ROOM_SHARE of a typical paycheck. Only
                  with a known balance; uncertain deposits never count
     UNKNOWN      Alon can't see this stretch yet (it says what it needs). Missing information is never PRESSURE.
   A wave the earlier paychecks carry is STEADY with a prepare note, not PRESSURE. */
const ROOM_SHARE = 0.25;
function moneyState(remainders, pb, hero, sf) {
  const prim = primarySource(), typical = prim && prim.certainty !== 'uncertain' ? (prim.typical || prim.low || 0) : 0;
  const buf = toD(bufferC()), td = iso(TODAY);
  if (hero.basis === 'unknown') return { state: 'UNKNOWN', needs: pb.missing.map(m => m.key), asks: pb.missing.map(m => m.ask) };
  if (hero.basis === 'runway') {   // never "room": nothing ahead is certain enough to call extra
    const through = hero.through || hero.past;
    if (hero.status !== 'Covered') return { state: 'PRESSURE', when: 'now', short: hero.amount < 0 || !!hero.through && hero.through < td, until: through, through, runway: true };
    return { state: 'STEADY', through, basis: 'runway', runway: true, past: !hero.through };
  }
  const lastR = remainders[remainders.length - 1], through = lastR ? iso(addDays(parse(lastR.nextPayday), -1)) : hero.until;
  const nowLow = hero.likely != null ? Math.min(hero.amount, hero.likely) : hero.amount;
  const nowPressure = hero.amount < 0 || nowLow < buf;
  if (hero.basis === 'spendable') {
    if (nowPressure) return { state: 'PRESSURE', when: 'now', short: hero.amount < 0, date: sf.status === 'short' ? sf.date : null, until: hero.until, through };
    if (sf.status === 'short') return { state: 'PRESSURE', when: 'ahead', short: true, date: sf.date, through };
    // free room: what could be used today without any later paycheck coming up short
    const val = r => r.likely != null ? r.likely : r.spendable;
    let low = hero.likely != null ? hero.likely : hero.amount;
    const ahead = pb.rows.filter(r => r.date >= td);
    ahead.forEach(r => { low = Math.min(low, val(r)); });
    const last = ahead[ahead.length - 1], ed = everydayC(0) == null ? 0 : (state.everydayPerWeek || 0) / 7;
    if (last) low = Math.min(low, val(last) - ed * Math.round((parse(pb.until) - parse(last.date)) / DAY));
    if (low < 0) { const dip = ahead.find(r => val(r) < 0); return { state: 'PRESSURE', when: 'ahead', short: true, likelyOnly: true, date: dip ? dip.date : null, through }; }
    const free = Math.floor((low - buf) / 10) * 10, threshold = Math.round(ROOM_SHARE * typical);
    if (typical > 0 && free >= threshold) return { state: 'OPPORTUNITY', freeRoom: free, threshold, buffer: buf, through };
    return { state: 'STEADY', freeRoom: Math.max(0, free), threshold, buffer: buf, through, basis: 'balance' };
  }
  // no balance: paycheck-level facts only, and no claims about room
  if (nowPressure) return { state: 'PRESSURE', when: 'now', short: hero.amount < 0, until: hero.until, through };
  const breaks_ = remainders.filter(r => parse(r.payday) > TODAY && (r.likely != null ? r.likely : r.remainder) < 0);
  if (breaks_.length) return { state: 'PRESSURE', when: 'ahead', short: true, date: breaks_[0].payday, through };
  return { state: 'STEADY', through, basis: 'paychecks', needs: ['balance'] };
}

/* F4. What the numbers show, for the paycheck screen and Ask Alon alike. Several can be true at once.
   gap: a paycheck's own bills are more than the paycheck, or spendable never recovers · timing: spendable
   dips below zero and a later deposit brings it back · missing: something Alon needs wasn't given ·
   none: nothing to flag. */
function forecastFacts(count) {
  const remainders = paycheckRemainders(count), balance = projectedBalance(count), shortfall = projectedShortfall(balance);
  const findings = [];
  remainders.filter(r => r.remainder < 0).forEach(r => findings.push({ kind: 'gap', payday: r.payday, amount: -r.remainder }));
  if (shortfall.status === 'short') findings.push(shortfall.recovers
    ? { kind: 'timing', date: shortfall.date, amount: shortfall.shortBy, recovers: shortfall.recovers.date, dipsIntoSetAside: shortfall.dipsIntoSetAside }
    : { kind: 'gap', date: shortfall.date, amount: shortfall.shortBy, recovers: null });
  if (!balance.complete) findings.push({ kind: 'missing', needs: balance.missing.map(m => m.key) });
  if (!findings.length) findings.push({ kind: 'none' });
  // One number, one meaning (Nov 12): if the only thing missing is whether set-aside money is in the account,
  // Alon still shows available money, counting it as in there (the safer guess), marked "about" and asked.
  const onlyRes = !balance.complete && balance.missing.length > 0 && balance.missing.every(m => m.key === 'reserved');
  // no income Alon can count on (only freelance, commission or "not sure" income): how long the money lasts
  const noDependable = !balance.complete && balance.missing.some(m => m.key === 'income') && balance.missing.every(m => m.key === 'income' || m.key === 'reserved');
  const resMissing = balance.missing.some(m => m.key === 'reserved');
  const heroBalance = (onlyRes || (noDependable && resMissing)) ? Object.assign(projectedBalance(count, { assumeReservedIn: true }), { assumed: 'reserved' }) : balance;
  const runway = noDependable && heroBalance.start ? runwayFacts(heroBalance) : null;
  const hero = runway || heroFacts(remainders, heroBalance), heroShortfall = onlyRes || runway ? projectedShortfall(heroBalance) : shortfall;
  return { today: iso(TODAY), hero, remainders, balance, heroBalance, shortfall, heroShortfall, findings, money: moneyState(remainders, heroBalance, hero, heroShortfall) };
}

/* The next six paychecks as the sea seen from a boat. Calm water means a paycheck is fine.

    }

    return `<g>
      <path d="M${P(-16, 8)} C${P(-10, 0)} ${P(-4, 0)} ${P(2, 0)} C${P(14, 0)} ${P(26, 6)} ${P(25, 17)} C${P(24, 25)} ${P(15, 27)} ${P(12, 21)} C${P(10, 17)} ${P(14, 13)} ${P(17, 15)} C${P(14, 9)} ${P(6, 9)} ${P(1, 13)} C${P(-4, 17)} ${P(-10, 16)} ${P(-16, 8)} Z" fill="#fff" stroke="#1659D0" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M${P(-11, 10)} Q${P(-8, 14)} ${P(-5, 11)} Q${P(-2, 15)} ${P(1, 12)}" fill="none" stroke="#B9CFEE" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M${P(5, 3)} C${P(13, 3)} ${P(20, 7)} ${P(21, 14)}" fill="none" stroke="#CFE0F7" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="${(cx + 27 * k).toFixed(1)}" cy="${(cy + 4 * k).toFixed(1)}" r="${(2 * k).toFixed(1)}" fill="#fff" stroke="#1659D0" stroke-width="1"/>

    <defs>

/* ---------- Step 2 (Nov 12): the wave is the water level of your available money ----------
   It rises on payday, drops for a bill (a big bill is the sea pulling back before the wave), and slopes
   gently down with everyday spending. Below $0 the sea floor shows, in amber. The dashed line is your
   buffer. Every paycheck stretch gets the same width, so the dates line up with What's ahead, and a tap
   on a stretch opens what moved it. The same drawing on Now, What's ahead, What if? and after a change.
     with a balance   the running balance (F2): what's available, after the everyday estimate
     without one      each paycheck on its own (F1), starting again on each payday
   Income that isn't certain is never part of the water: it's drawn as a dashed "maybe" rise. */
function seaSeries(ws, purchase) {
  const f = facts(), h = f.hero, n = ws.length;
  if (!n || persona().unit !== 'paycheck' || !['spendable', 'remainder', 'runway'].includes(h.basis)) return null;
  const buy = purchase || 0, pts = [], maybe = [];
  const edC = days => state.everydayUnknown ? 0 : Math.round(toC(state.everydayPerWeek || 0) * Math.max(0, days) / 7);
  const startOf = (w, i) => i === 0 ? TODAY : w.start;
  const xAt = (i, t, w) => { const a = startOf(w, i), b = w.end, span = Math.max(1, b - a); return i + Math.min(1, Math.max(0, (t - a) / span)); };
  if (h.basis === 'spendable' || h.basis === 'runway') {
    const pb = factsLong().heroBalance, asOf = parse(pb.asOf), rows = pb.rows;
    let k = 0, spC = toC((h.now || pb.start).spendable);
    const td = iso(TODAY);
    while (k < rows.length && rows[k].date < td) { spC = toC(rows[k].spendable); k++; }
    const lvl = (c, t) => c - edC(Math.round((t - asOf) / DAY)) - toC(buy);
    ws.forEach((w, i) => {
      const a = startOf(w, i), b = w.end;
      for (let t = a; t < b; t = addDays(t, 1)) {
        const day = iso(t);
        let lowC = Infinity, had = false;   // the lowest moment inside the day (a bill that clears before the deposit)
        while (k < rows.length && rows[k].date === day) { spC = toC(rows[k].spendable); lowC = Math.min(lowC, spC); had = true; k++; }
        const x = xAt(i, t, w);
        const dx = 1 / Math.max(1, (b - a) / DAY);
        if (had && lowC < spC) pts.push({ x: x + 0.45 * dx, v: lvl(lowC, t), t });   // a dip before money lands the same day
        pts.push({ x: x + (had ? 0.95 : 0) * dx, v: lvl(spC, t), t, ev: had });
      }
    });
    const last = ws[n - 1]; pts.push({ x: n, v: lvl(spC, last.end), t: last.end });
  } else {
    const rems = factsLong().remainders;
    ws.forEach((w, i) => {
      const r = rems.find(x => x.payday === iso(w.start));
      if (!r) return;
      const pay = parse(r.payday), a = startOf(w, i), b = w.end;
      const baseC = centsSum(r.deposits, x => x.amount) + centsSum(r.coveredEarlier, x => x.amount) - centsSum(r.setAsideHere, x => x.amount);
      if (i > 0) pts.push({ x: i, v: pts.length ? pts[pts.length - 1].v : baseC, t: a, gap: true });   // a new paycheck: the water starts again
      for (let t = a; t <= b; t = addDays(t, 1)) {
        const day = iso(t);
        const outC = centsSum(r.obligations.filter(o => o.date <= day && (t < b || o.date < day)), o => o.amount);
        pts.push({ x: xAt(i, t, w), v: baseC - outC - edC(Math.round((t - pay) / DAY)) - (i === 0 ? toC(buy) : 0), t });
        if (t >= b) break;
      }
    });
  }
  // income that isn't certain: a dashed "maybe" rise where it could land (never counted as available)
  ws.forEach((w, i) => state.sources.filter(s => s.certainty === 'uncertain' && !s.perWeek).forEach(s =>
    occurrences(s, startOf(w, i), w.end).forEach(t => { if (state.actuals[s.id + '|' + t] == null) maybe.push({ x: xAt(i, t, w), amount: toC(s.typical || s.low || 0), name: s.name, t }); })));
  return { pts: pts.map(p => Object.assign(p, { v: p.v / 100 })), maybe: maybe.map(m => Object.assign(m, { amount: m.amount / 100 })), basis: h.basis === 'runway' ? 'spendable' : h.basis };
}
/* A smooth line that never overshoots (monotone cubic), so a dip near $0 never looks deeper or shallower. */
function smoothPath(P) {
  if (P.length < 2) return '';
  const n = P.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((P[i + 1][1] - P[i][1]) / Math.max(1e-6, P[i + 1][0] - P[i][0]));
  m.push(d[0]); for (let i = 1; i < n - 1; i++) m.push(d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2); m.push(d[n - 2]);
  let out = `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = P[i + 1][0] - P[i][0];
    out += ` C${(P[i][0] + h / 3).toFixed(1)},${(P[i][1] + m[i] * h / 3).toFixed(1)} ${(P[i + 1][0] - h / 3).toFixed(1)},${(P[i + 1][1] - m[i + 1] * h / 3).toFixed(1)} ${P[i + 1][0].toFixed(1)},${P[i + 1][1].toFixed(1)}`;
  }
  return out;
}
function seaLine(ws, opts) {
  opts = opts || {};
  const S = seaSeries(ws, opts.purchase);
  if (!S || S.pts.length < 2) return null;
  const n = ws.length, W = 60 * n, H = opts.height || 112, top = 10, bottom = H - 8, buf = bufferAmt();
  const vals = S.pts.map(p => p.v), maxV = Math.max(buf * 1.5, ...vals, 100), minV = Math.min(0, ...vals);
  /* Each band keeps its order and stays linear inside: below $0 gets at least a fifth of the height when
     it happens, $0 to the buffer at least a sixth, so a dip near the floor is never too small to see. */
  const Hh = bottom - top, negH = minV < 0 ? Math.max(0.2, -minV / (maxV - minV)) * Hh : 0;
  const bufH = buf > 0 ? Math.max(Hh / 6, buf / Math.max(1, maxV - minV) * Hh) : 0, upH = Hh - negH - bufH;
  const y = v => v < 0 ? bottom - negH + (-v / Math.max(1, -minV)) * negH
    : v < buf ? bottom - negH - (v / Math.max(1, buf)) * bufH
    : top + (maxV - v) / Math.max(1, maxV - buf) * upH;
  const span = Math.max(1, maxV - minV);
  const X = x => x * 60, y0 = y(0);
  const segs = [];   // without a balance, each paycheck is its own stretch of water
  S.pts.forEach(p => { if (p.gap || !segs.length) segs.push([]); if (!p.gap) segs[segs.length - 1].push([X(p.x), y(p.v)]); });
  const lines = segs.filter(g => g.length > 1).map(smoothPath);
  const bodies = segs.filter(g => g.length > 1).map((g, k) => `${lines[k]} L${g[g.length - 1][0].toFixed(1)},${y0.toFixed(1)} L${g[0][0].toFixed(1)},${y0.toFixed(1)} Z`);
  const uid = 'sea' + Math.round(Math.random() * 1e6);
  let low = S.pts[0];
  S.pts.forEach(p => { if (!p.gap && p.v < low.v) low = p; });
  const short_ = low.v < 0;
  const lowMark = opts.markLow ? `<circle cx="${X(low.x).toFixed(1)}" cy="${y(low.v).toFixed(1)}" r="4" fill="#fff" stroke="${short_ ? '#B4690E' : '#1659D0'}" stroke-width="2"/>` : '';
  const maybeMarks = S.maybe.map(m => { const x = X(m.x), y1 = y(Math.max(0, low.v)), y2 = Math.max(top, y1 - Math.min(bottom - top, m.amount / span * (bottom - top))); return `<path d="M${x.toFixed(1)},${(y1).toFixed(1)} L${x.toFixed(1)},${y2.toFixed(1)}" stroke="#7FAEEE" stroke-width="2" stroke-dasharray="3 3" fill="none"/><circle cx="${x.toFixed(1)}" cy="${y2.toFixed(1)}" r="3" fill="#fff" stroke="#7FAEEE" stroke-width="1.5"/>`; }).join('');
  const lowWord = `${short_ ? 'could come up short' : 'lowest point'}: about ${money(Math.abs(low.v))}${short_ ? '' : ''} around ${short(low.t)}`;
  const label = `${S.basis === 'spendable' ? 'Your available money' : 'What each paycheck has left'} over the next ${n} ${unitWord2()}s. It rises on payday and dips for bills. ${capFirst(lowWord)}.${S.maybe.length ? ` Income that isn’t certain is shown as a dashed maybe and isn’t counted.` : ''}`;
  const svg = `<svg class="sea-line" width="100%" viewBox="-6 0 ${W + 12} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}" style="display:block;overflow:visible">
    <defs>
      <linearGradient id="${uid}-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5C93E6"/><stop offset="1" stop-color="#B9D1F4"/></linearGradient>
      <clipPath id="${uid}-up"><rect x="-4" y="-40" width="${W + 8}" height="${(y0 + 40).toFixed(1)}"/></clipPath>
      <clipPath id="${uid}-dn"><rect x="-4" y="${y0.toFixed(1)}" width="${W + 8}" height="${(H - y0 + 40).toFixed(1)}"/></clipPath>
    </defs>
    ${bodies.map(d => `<path d="${d}" fill="url(#${uid}-w)" opacity=".8" clip-path="url(#${uid}-up)"/><path d="${d}" fill="#F3C98B" clip-path="url(#${uid}-dn)"/>`).join('')}
    <line x1="0" y1="${y0.toFixed(1)}" x2="${W}" y2="${y0.toFixed(1)}" stroke="#D9C4A0" stroke-width="1.5"/>
    ${buf > 0 && y(buf) > top + 2 ? `<line class="sea-buffer" x1="0" y1="${y(buf).toFixed(1)}" x2="${W}" y2="${y(buf).toFixed(1)}" stroke="#7C8CA6" stroke-width="1" stroke-dasharray="4 5" opacity=".7"/>` : ''}
    ${lines.map(d => `<path d="${d}" fill="none" stroke="${short_ ? '#1659D0' : '#1659D0'}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}
    ${maybeMarks}
    <circle cx="${X(S.pts[0].x).toFixed(1)}" cy="${y(S.pts[0].v).toFixed(1)}" r="4.5" fill="#fff" stroke="#1659D0" stroke-width="2"/>
    ${lowMark}
    ${opts.tap ? ws.map((w, i) => `<rect class="wave-hit" x="${i * 60}" y="-20" width="60" height="${H + 20}" fill="transparent" data-action="why-window" data-window="${w.i}" aria-hidden="true"/>`).join('') : ''}
  </svg>`;
  return { svg, low: { v: low.v, t: low.t, short: short_ }, basis: S.basis, maybe: S.maybe };
}

/* ---------- the wave rail ----------
   Where = four dots. Do = this rail. Ask = the bar at the bottom. Now = the screen.
   Three actions per screen; the main one sits in the knob. Tap a label, or slide the
   knob to it. The rail's edge is Alon's wave, and the swell follows the knob. */
const RAIL_W = 64;
let RAIL = { h: 760, slots: [298, 410, 522] };
function railGeom() {
  const h = (typeof app !== 'undefined' && app && app.clientHeight) || 760;
  const c = Math.round(h * 0.54);                 // the thumb's resting height
  RAIL = { h, slots: [c - 90, c, c + 90] };
}
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* An ocean edge in three layers, top to bottom of the screen:
   a pale swell at the back, a brighter wave with a foam line, and the deep navy
   water in front, which opens into a pocket that holds the knob. The back two drift. */
const SEA = [
  { color: '#F1F5FC', base: 17, amp: 5, len: 196, dur: 18 },
  { color: '#E9F0FB', base: 12, amp: 4, len: 148, dur: 12, line: '#D5DFEE' }
];
const crest = th => (Math.sin(th) + 0.34 * Math.sin(2 * th + 0.9)) / 1.26;   // a crest that leans, like a breaking wave
function waveEdge(base, amp, len, h) {
  const pts = [];
  for (let y = 0; y <= h; y += 4) pts.push(`${(RAIL_W - (base + amp * crest(2 * Math.PI * y / len))).toFixed(1)},${y}`);
  return pts;
}
function seaLayer(w) {
  const h = RAIL.h + w.len, edge = waveEdge(w.base, w.amp, w.len, h);
  return `<svg class="wave-layer" width="${RAIL_W}" height="${h}" viewBox="0 0 ${RAIL_W} ${h}" style="--len:${w.len}px;animation-duration:${w.dur}s">
    <path d="M${RAIL_W},0 L${edge.join(' L')} L${RAIL_W},${h} Z" fill="${w.color}"/>
    ${w.line ? `<path d="M${edge.join(' L')}" fill="none" stroke="${w.line}" stroke-width="1" stroke-linejoin="round"/>` : ''}
  </svg>`;
}
function railEdge(ky) {
  const pts = [];
  for (let y = 0; y <= RAIL.h; y += 4) {
    const swell = Math.exp(-Math.pow((y - ky) / 66, 2));                        // a soft swell around the knob
    const water = 7 + 1.5 * crest(2 * Math.PI * y / 110);                        // the edge itself: small waves
    pts.push(`${(RAIL_W - (water * (1 - swell) + 46 * swell)).toFixed(1)},${y}`);
  }
  return pts;
}

function railLine(ky) { return `M${railEdge(ky).join(' L')}`; }

function railActions() {

    case 'why': {

      return [go('Back', 'waves'), act('Plan', 'plan', { disabled: !state.picked && !(state.prepAmt > 0), hint: 'Slide to prepare, or pick an option.' }), act('Leave', 'leave', { aria: 'Leave it as is' })];

    }

/* "Prepare for the wave": move the amount and watch the wave come down. It's a preview until
   Plan is pressed, and the money only counts as set aside once it's confirmed on payday. */
function prepCard(ws, sm) {
  const u = unitWord(), k = sm.k, target = ws[k];
  const need = round5(-target.roomLow);
  const pv = prepNow(ws, sm);
  const max = Math.min(need, pv.most);
  return `<div class="card stack gap12">
    <span class="eyebrow" style="color:var(--royal)">Prepare for the wave</span>
    <div id="prep-chart" class="prep-chart">${waveChart(pv.after)}</div>
    <div class="row"><span class="small" style="font-weight:700">Amount prepared</span><span id="prep-val" style="font-size:18px;font-weight:800">${money(pv.prepared)} <span class="small" style="font-weight:600">of ${money(need)}</span></span></div>
    <input type="range" id="prep-range" data-prep min="0" max="${max}" step="5" value="${Math.min(pv.prepared, max)}" aria-label="Amount to prepare for ${windowShortName(target)}" style="width:100%;accent-color:var(--royal)">
    <p id="prep-text" class="small" style="margin:0;line-height:1.5">${prepText(ws, k, pv, need)}</p>
    <span class="small" style="color:var(--muted)">A preview. Nothing is set aside until you plan it, and you move the money yourself.</span>
  </div>`;
}
function prepText(ws, k, pv, need) {
  const u = unitWord(), name = windowShortName(ws[k]);
  const from = pv.allocs.map(a => `${money(a.amount)} from ${windowShortName(ws[a.from])}`);
  const cap = pv.most < need ? ` The ${u}s before it have ${money(pv.most)} of room in total, so that’s the most you can prepare here.` : '';
  if (!pv.prepared) return `Slide to set money aside from the ${u}s before ${name}. The wave comes down as you do.${cap}`;
  if (pv.prepared >= need) return `<strong style="color:var(--navy)">${name} is covered.</strong> ${listJoin(from)}. Press Plan on the wave to keep it.`;
  return `${money(need - pv.prepared)} still to cover. ${listJoin(from)}.${cap}`;
}
let prepWasCovered = false;
function prepNow(ws, sm) {
  const o = state.picked && sm.opts.find(x => x.id === state.picked);
  return o ? prepPreview(ws, sm.k, 0, o.allocs) : prepPreview(ws, sm.k, state.prepAmt || 0);
}
function refreshPrep() {
  const ws = computeWindows(), sm = smoothing(ws);
  if (!sm) return;
  const need = round5(-ws[sm.k].roomLow);
  const pv = prepNow(ws, sm);
  const chart = document.getElementById('prep-chart');
  chart.innerHTML = waveChart(pv.after);
  const covered = pv.prepared >= need;
  if (covered && !prepWasCovered && !reduceMotion()) { chart.classList.remove('settle'); void chart.offsetWidth; chart.classList.add('settle'); }
  prepWasCovered = covered;
  document.getElementById('prep-val').innerHTML = `${money(pv.prepared)} <span class="small" style="font-weight:600">of ${money(need)}</span>`;
  document.getElementById('prep-text').innerHTML = prepText(ws, sm.k, pv, need);
  updateRail(); save();
}

function screenCheck() {

/* What if?'s one-line answer under the wave: the lowest point with this purchase in it. */
function seaLowText(sea, amt) {
  const l = sea.low, when = short(l.t);
  const what = amt > 0 ? 'With it, your' : 'Your';
  return l.short ? `${what} money could dip about ${money(-l.v)} below $0 around ${when}.` : `${what} lowest point ahead: about ${money(l.v)}, around ${when}${l.v < bufferAmt() ? `, under your ${money(bufferAmt())} buffer` : ''}.`;
}
/* "What can I spend?": room in this window, minus a cushion the person chooses, rounded down to $5.
   Planned on the lighter case; the typical case is shown beside it. */
function spendRoom(ws) {
  const w0 = ws[0], c = bufferAmt(), st = stretchFor(w0);
  const floor5 = n => Math.max(0, Math.floor(n / 5) * 5);
  if (st) {   // one number, one meaning: free to spend = available, after the everyday estimate and the buffer
    const lvl = st.likely != null ? Math.min(st.available, st.likely) : st.available, typ = Math.max(0, w0.roomTyp - w0.roomLow);   // a paycheck that varies: the typical case on top
    const ahead = ws.slice(1).map(stretchWindow).find(w => w.stretch && w.stretch.status === 'Short') || null;
    return { w0, c, st, lvl, typ, freeLow: floor5(lvl - c), freeTyp: floor5(lvl + typ - c), ahead };
  }
  return { w0, c, freeLow: floor5(w0.roomLow - c), freeTyp: floor5(w0.roomTyp - c), ahead: ws.slice(1).find(w => w.roomLow < 0) || null };
}
function checkNumbers(w0, amt) {
  const p = persona(), st = stretchFor(w0);
  if (st) {   // the same available number as Now; the sentence uses what's left after everyday spending
    const lvl = st.likely != null ? Math.min(st.available, st.likely) : st.available, after = lvl - amt, until = short(parse(st.until)), typ = Math.max(0, w0.roomTyp - w0.roomLow);
    const explain = lvl < 0 ? `This stretch could already come up ${money(-lvl)} short before this purchase.`
      : after >= bufferAmt() ? `This fits. After it and your everyday spending, about ${money(after)} is left before ${until}.`
      : after >= 0 ? `This fits, but after it and your everyday spending only about ${money(after)} is left before ${until}${bufferAmt() ? `, under your ${money(bufferAmt())} buffer` : ''}.`
      : `This is about ${money(-after)} more than what’s free before ${until}. It would come from money for bills or everyday spending.`;
    return { aLow: after, aTyp: after + typ, explain, st };
  }
  const aLow = w0.roomLow - amt, aTyp = w0.roomTyp - amt;
  const until = p.unit === 'week' ? `the end of the week` : short(w0.end);
  let explain;
  if (w0.roomLow < 0) explain = `This ${p.unit} could already come up ${money(-w0.roomLow)} short before this purchase.`;
  else if (aLow >= 150) explain = `This fits, even on a lighter ${p.unit}, and leaves at least ${money(aLow)} for anything unexpected before ${until}.`;
  else if (aLow >= 0) explain = `This fits, but on a lighter ${p.unit} it leaves only ${money(aLow)} for anything unexpected before ${until}.`;
  else if (aTyp >= 0) explain = `On a typical ${p.unit} this fits with ${money(aTyp)} left. On a lighter one it’s ${money(-aLow)} more than what’s left.`;
  else explain = `This is ${money(-aTyp)} more than what’s left, even on a typical ${p.unit}. It would come from money set for bills or everyday spending.`;
  return { aLow, aTyp, explain };
}

/* ---------- add or edit an income source ---------- */

const incomeKind = id => INCOME_KINDS.find(k => k[0] === id) || null;
const KEEP_KINDS = ['1099', 'rental', 'business'];
function incomeFormFrom(src) {

  const kp = src.keep || {};
  return { id: src.id, name: src.name, kind: src.certainty, amount: String(src.typical), low: String(src.low), typical: String(src.typical), freq: src.freq, start: src.start, day2: src.day2 ? String(src.day2) : '', perWeek: !!src.perWeek,
    ikind: src.ikind || '', spread: Number(src.spread) || 0, keepMode: kp.pct ? 'pct' : kp.amt ? 'amt' : 'none', keepVal: kp.pct ? String(kp.pct) : kp.amt ? String(kp.amt) : '', keepFor: kp.for || 'taxes' };
}

  else { low = typ = parseMoney(f.amount); }

  const src = Object.assign({}, base || { id: 'i' + Date.now(), type: 'Income' }, { name: f.name.trim(), certainty: f.kind, low, typical: typ });
  if (f.ikind) { src.ikind = f.ikind; src.type = (incomeKind(f.ikind) || [])[1] || src.type; }

  else if (f.keepMode === 'amt' && kv > 0) src.keep = { amt: kv, for: f.keepFor || 'taxes' };

function goalSuggestHtml(pv) {

/* ===================== Something came up =====================
   An unexpected bill: a car repair, a doctor's bill, a furnace, a burst pipe. Alon adds it
   like any bill, shows what it does to the next paychecks, and lays out ways to cover it:
   the surprise fund, money saved for goals, skipping goal set-asides while it's paid.
   Money taken from savings lands on the day of the payment, because nothing carries over
   between paychecks. Alon never lends; when nothing covers it, it says so and keeps showing it. */
const SURPRISE_KINDS = [['car', 'Car repair'], ['medical', 'Medical bill'], ['home', 'Home repair'], ['other', 'Something else']];
const PART_CHOICES = [2, 3, 4, 6, 12];
const unitWord = () => persona().unit === 'month' ? 'window' : persona().unit;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const listJoin = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
function freshSurpriseForm(kind) {
  const k = SURPRISE_KINDS.find(x => x[0] === kind);
  return { kind: k ? k[0] : null, name: k && k[0] !== 'other' ? k[1] : '', amount: '', due: iso(TODAY), parts: 1,
           cover: { fund: savedIn(fundGoals()) > 0, goals: false, skip: false }, fundUse: null, goalsUse: null };
}
function withState(patch, fn) {
  const kept = {}; Object.keys(patch).forEach(k => { kept[k] = state[k]; state[k] = patch[k]; });
  try { return fn(); } finally { Object.assign(state, kept); }
}
const savedIn = list => sum(list, g => Math.max(0, g.saved || 0));
const fundGoals = () => (state.goals || []).filter(g => g.fund);
const otherSavedGoals = () => (state.goals || []).filter(g => !g.fund && (g.saved || 0) > 0);
function windowStartOf(t) { return windowStarts(t).filter(s => s <= t).pop(); }
function surpriseValid(f) { return !!(f && f.name.trim() && parseMoney(f.amount) > 0 && /^\d{4}-\d{2}-\d{2}$/.test(f.due || '')); }

/* Apply the surprise and the chosen ways to cover it to copies of the bills, goals and
   draws. Nothing in state changes until Save. */
function surpriseBuild(f, sid) {
  const amount = parseMoney(f.amount) || 0;
  const n = Math.max(1, Number(f.parts) || 1);
  const each = n > 1 ? Math.ceil(amount / n) : amount;           // rounded up to the dollar, never under
  const due = iso(Math.max(parse(f.due), TODAY));
  const bill = { id: 'b' + sid, name: f.name.trim(), amount: each, freq: n > 1 ? 'monthly' : 'once', start: due, status: 'confirmed', surprise: sid };
  if (n > 1) bill.count = n;
  const fee = n > 1 ? parseMoney(f.partFee) || 0 : 0;
  const payments = occurrences(bill, parse(due), addDays(parse(due), 800)).map(t => ({ t, left: each }));
  const goals = clone(state.goals || []);
  const bills = state.bills.concat([bill], fee ? [{ id: 'bf' + sid, name: `${bill.name} · fee`, amount: fee, freq: 'once', start: due, status: 'confirmed', surprise: sid }] : []);
  const draws = (state.draws || []).slice();
  const added = { skips: {}, drawn: {} };
  const view = () => withState({ bills, goals, draws }, computeWindows);
  const res = { amount, n, each, due, bill, fee, payments, goals, bills, draws, added, skipFree: 0, fundUsed: 0, goalsUsed: 0, needed: 0 };

  // 1. Skip what goes to goals in the paychecks where a payment lands.
  if (f.cover.skip) {
    const before = view();
    const starts = [...new Set(payments.map(p => iso(windowStartOf(p.t))))];
    goals.forEach(g => {
      if (g.paused || goalPlan(g).done) return;
      const add = starts.filter(s => !(g.skips || []).includes(s) && (g.hist || {})[s] == null);
      if (add.length) { g.skips = (g.skips || []).concat(add); added.skips[g.id] = add; }
    });
    const after = view();
    res.skipFree = before.reduce((t, w, i) => t + (payments.some(p => p.t >= w.start && p.t < w.end) ? w.goalTotal - after[i].goalTotal : 0), 0);
  }
  // Take money from savings: payments in short paychecks first, then the rest by date.
  const allocate = (pool, total) => {
    let toUse = Math.min(total, savedIn(pool));
    const ws = view();
    const shortAt = p => { const w = ws.find(x => p.t >= x.start && p.t < x.end); return w ? w.roomLow < 0 : false; };
    const order = payments.filter(p => p.left > 0).sort((a, b) => (shortAt(b) - shortAt(a)) || a.t - b.t);
    let used = 0;
    for (const p of order) for (const g of pool) {
      if (toUse <= 0 || p.left <= 0) break;
      const take = Math.min(p.left, toUse, Math.max(0, g.saved || 0));
      if (take <= 0) continue;
      g.saved -= take; p.left -= take; toUse -= take; used += take;
      added.drawn[g.id] = (added.drawn[g.id] || 0) + take;
      draws.push({ id: 'd' + sid + '_' + draws.length, goalId: g.id, name: g.name, date: iso(p.t), amount: take, surprise: sid });
    }
    return used;
  };
  // 2. The surprise fund: by default, as much of the bill as it holds.
  if (f.cover.fund) {
    const pool = goals.filter(g => g.fund);
    res.fundUsed = allocate(pool, f.fundUse == null ? Math.min(savedIn(pool), amount) : (parseMoney(f.fundUse) || 0));
  }
  // 3. Money saved for other goals: by default, only what keeps these paychecks out of the red.
  {
    const ws = view();
    res.needed = sum(ws, w => {
      const here = payments.filter(p => p.t >= w.start && p.t < w.end);
      return here.length && w.roomLow < 0 ? Math.min(-w.roomLow, sum(here, p => p.left)) : 0;
    });
  }
  if (f.cover.goals) {
    const pool = goals.filter(g => !g.fund && (g.saved || 0) > 0).sort((a, b) => (b.saved || 0) - (a.saved || 0));
    if (f.goalsUse != null) res.goalsUsed = allocate(pool, parseMoney(f.goalsUse) || 0);
    else {
      // Only what's needed. Taking from a goal with a date raises what it needs each paycheck,
      // so check again and top up until these paychecks are clear or the savings run out.
      for (let k = 0, need = res.needed; k < 6 && need > 0; k++) {
        const got = allocate(pool, need);
        res.goalsUsed += got;
        if (!got) break;
        const ws = view();
        need = sum(ws, w => { const here = payments.filter(p => p.t >= w.start && p.t < w.end); return here.length && w.roomLow < 0 ? Math.min(-w.roomLow, sum(here, p => p.left)) : 0; });
      }
    }
  }
  res.after = view();
  return res;
}

/* Everything the screen shows, from the engine's numbers. */
function surpriseView(f) {
  if (!surpriseValid(f)) return { valid: false };
  const u = unitWord();
  const base = computeWindows();
  const none = { fund: false, goals: false, skip: false };
  const plain = surpriseBuild(Object.assign({}, f, { cover: none }), 'x');
  const b = surpriseBuild(f, 'x');
  const mid = plain.after, after = b.after;
  const changedRows = ws => base.map((w, i) => ({ w, before: w.roomLow, after: ws[i].roomLow })).filter(r => r.after !== r.before);
  const when = b.n > 1 ? `${b.n} payments of ${money(b.each)}, monthly from ${short(parse(b.due))}${b.fee ? `, plus a ${money(b.fee)} fee` : ''}` : `${money(b.amount)} on ${short(parse(b.due))}`;
  const worse = ws => ({
    made: ws.filter((w, i) => w.roomLow < 0 && base[i].roomLow >= 0),
    deeper: ws.filter((w, i) => w.roomLow < base[i].roomLow && base[i].roomLow < 0) });
  const worseText = (x, lead) => [
    x.made.length ? `${lead}${listJoin(x.made.map(w => `${windowShortName(w)} ${money(-w.roomLow)} short`))}.` : '',
    x.deeper.length === 1 ? `${windowShortName(x.deeper[0])}, already short, would be ${money(-x.deeper[0].roomLow)} short instead of ${money(-base[x.deeper[0].i].roomLow)}.`
      : x.deeper.length ? `${x.deeper.length} ${u}s that were already short get deeper.` : ''
  ].filter(Boolean).join(' ');
  const m = worse(mid);
  const impact = `${when}. ` + (m.made.length || m.deeper.length ? worseText(m, 'On its own, it would leave ') : `Your ${u}s can absorb it; none comes up short because of it.`);

  // What each way of covering it changes for the goals behind it.
  const goalWas = id => (state.goals || []).find(g => g.id === id);
  const effects = [];
  Object.entries(b.added.drawn).forEach(([id, amt]) => {
    const old = goalWas(id), now = b.goals.find(g => g.id === id);
    const p0 = goalPlan(old), p1 = withState({ goals: b.goals, draws: b.draws, bills: b.bills }, () => goalPlan(now));
    let tail = '';
    if (now.paused) tail = ' It’s paused, so it won’t refill until you turn it back on.';
    else if (now.mode === 'amount') tail = now.fund
      ? ` It refills at ${money(p1.per)} a ${u}, full again about ${p1.finish ? monthYear(p1.finish) : 'later'}.`
      : ` Reached about ${p1.finish ? monthYear(p1.finish) : 'later'}${p0.finish && !p0.done ? ` instead of ${monthYear(p0.finish)}` : ''}.`;
    else tail = ` To still reach it by ${withYear(parse(now.by))}: ${money(p1.per)} a ${u}${p0.done ? '' : ` instead of ${money(p0.per)}`}.`;
    effects.push(`${esc(now.name)}: ${money(old.saved || 0)} → ${money(now.saved)}.${tail}`);
  });
  Object.entries(b.added.skips).forEach(([id, dates]) => {
    if (b.added.drawn[id]) return;                                   // already described above
    const old = goalWas(id), now = b.goals.find(g => g.id === id);
    const p0 = goalPlan(old), p1 = goalPlan(now);
    effects.push(`${esc(now.name)} skips ${plural(dates.length, u)}. ${now.mode === 'amount' ? `Reached about ${p1.finish ? monthYear(p1.finish) : 'later'} instead of ${p0.finish ? monthYear(p0.finish) : 'later'}.` : `The rest goes up to ${money(p1.per)} a ${u}.`}`);
  });

  const a = worse(after);
  const stillShort = a.made.concat(a.deeper);
  const fundSaved = savedIn(fundGoals()), otherSaved = savedIn(otherSavedGoals());
  const activeGoals = (state.goals || []).some(g => !g.paused && !goalPlan(g).done);
  const anyCover = f.cover.fund || f.cover.goals || f.cover.skip;
  const payShort = after.some(w => w.roomLow < 0 && b.payments.some(p => p.t >= w.start && p.t < w.end) && w.roomLow < base[w.i].roomLow);
  const summary = stillShort.length
    ? `${worseText(a, 'It would leave ')} ${!anyCover ? (fundSaved || otherSaved || activeGoals ? 'Nothing picked to cover it yet.' : '') : payShort ? 'What you picked doesn’t cover all of it.' : `That’s your goal needing a little more each ${u} to stay on its date.`} Alon keeps showing it so it isn’t a surprise twice.`
    : base.some(w => w.roomLow < 0) ? `Nothing gets shorter than it already was.` : `Every ${u} in the next six stays out of the red.`;
  return { valid: true, b, impact, impactRows: changedRows(mid), resultRows: changedRows(after), effects, summary, stillShort, fundSaved, otherSaved, activeGoals };
}
function rowsHtml(rows) {
  if (!rows.length) return '';
  return `<div class="stack mt8">${rows.map(r => `<div class="row" style="padding:6px 0;border-top:1px solid #E7E1D3;font-size:15px"><span>${windowShortName(r.w)}</span><span style="font-variant-numeric:tabular-nums;white-space:nowrap"><span class="small">${money(r.before)} →</span> <strong style="${r.after < 0 ? 'color:var(--amber-text)' : ''}">${money(r.after)}</strong></span></div>`).join('')}</div>`;
}
/* The ways to cover it that are actually possible for this person right now. */
function coverAvail(v) {

    .filter(x => x[2]).map(x => [x[0], x[1]]);
}
function coverDesc(key, v, f) {

/* The paycheck a new surprise still leaves short, after what's been picked to cover it. */

function backupPayload() {

async function saveBackup() {
  const name = `alon-backup-${realToday()}.json`, text = JSON.stringify(backupPayload(), null, 1);
  let file = null; try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
  let done = false;

    if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Alon backup' }); done = true; }
  } catch (e) { if (e && e.name === 'AbortError') return; }   // they closed the share sheet: nothing saved, nothing claimed
  if (!done) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file || new Blob([text], { type: 'application/json' })); a.download = name;
    document.body.appendChild(a); a.click();

  }

}
function readBackup(file) {
  const r = new FileReader();

    let data = null; try { data = JSON.parse(r.result); } catch (e) {}
    const okFile = data && data.app === 'alon' && data.state && Array.isArray(data.state.bills) && Array.isArray(data.state.sources);
    pendingRestore = okFile ? { data, name: file.name } : { error: true, name: file.name };

const fbValid = () => !!(state.fb && (state.fb.text.trim() || state.fb.kind));
function fbQueue() { try { return JSON.parse(localStorage.getItem('alon-feedback-queue') || '[]'); } catch (e) { return []; } }
