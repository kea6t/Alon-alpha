<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF7F0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Alon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #FAF7F0;
    --white: #FFFFFF;
    --tint: #E8EFFB;
    --field-line: #D5DFEE;
    --line: #E3E8EE;
    --chip-line: #BFCDE3;
    --royal: #1659D0;
    --navy: #0E2440;
    --muted: #4A5A6B;
    --muted-2: #3E5068;
    --amber-bg: #F6EBD3;
    --amber-line: #E8D3A6;
    --amber-text: #7A4F0F;
    --amber-body: #5A4520;
    --amber-dot: #C98A1E;
    --est: #5A6472;
    --est-dot: #7C8794;
    --ok-dot: #2E8A6A;
    --backdrop: #D6E2F3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--backdrop); font-family: 'Manrope', system-ui, -apple-system, sans-serif; color: var(--navy); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, input { font-family: inherit; color: inherit; }
  a { color: var(--royal); }

  body { height: 100vh; height: 100dvh; overflow: hidden; }
  .phone { position: relative; width: 100%; max-width: 430px; height: 100%; margin: 0 auto; background: var(--ivory); display: flex; flex-direction: column; overflow: hidden; }
  .phone.wide { max-width: min(880px, calc(100vw - 32px)); }
  .scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; scrollbar-width: none; }
  .scroller::-webkit-scrollbar { display: none; }
  @media (min-width: 520px) {
    body { padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
    .phone { flex: 1 1 auto; min-height: 0; height: auto; max-height: 920px; border-radius: 40px; box-shadow: 0 1px 2px rgba(14,36,64,.08), 0 20px 60px rgba(14,36,64,.12); }
  }
  .demo-tag { text-align: center; font-size: 12px; color: var(--muted); padding: 0 0 10px; margin: 0; flex: none; }
  @media (max-width: 519px) { .demo-tag { display: none; } }
  main { flex: 1; display: flex; flex-direction: column; padding-bottom: 24px; }

  .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px 6px; position: relative; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .back { display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 16px; font-weight: 600; background: none; border: 0; padding: 0; cursor: pointer; color: var(--royal); }
  .dots { width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--field-line); background: var(--white); display: grid; grid-template-columns: repeat(2, 6px); gap: 6px; place-content: center; cursor: pointer; padding: 0; }
  .dots span { width: 6px; height: 6px; border-radius: 3px; background: var(--royal); }
  .menu { position: absolute; top: 64px; right: 24px; z-index: 20; background: var(--white); border: 1px solid var(--line); border-radius: 20px; padding: 8px; min-width: 230px; box-shadow: 0 12px 40px rgba(14,36,64,.14); display: flex; flex-direction: column; }
  .menu button { text-align: left; background: none; border: 0; padding: 14px 16px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .menu button:hover { background: var(--tint); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 8px; }
  .menu .quiet { font-size: 14px; color: var(--muted); }

  .pad { padding-left: 24px; padding-right: 24px; }
  .eyebrow { font-size: 14px; font-weight: 600; color: var(--muted); }
  .h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
  .h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .hero { font-size: 76px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .hero.range { font-size: 50px; }
  .hero.short { color: var(--amber-text); }
  .body { font-size: 15px; color: var(--muted); line-height: 1.5; margin: 0; }
  .small { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0; }

  .card { background: var(--white); border: 1px solid var(--line); border-radius: 22px; padding: 16px; }
  .tint { background: var(--tint); border-radius: 20px; padding: 16px; }
  .warn { background: var(--amber-bg); border: 1px solid var(--amber-line); border-radius: 20px; padding: 16px; }
  .stack { display: flex; flex-direction: column; }
  .gap4 { gap: 4px; } .gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap12 { gap: 12px; } .gap14 { gap: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mt8 { margin-top: 8px; } .mt14 { margin-top: 14px; } .mt20 { margin-top: 20px; } .mt24 { margin-top: 24px; } .mt28 { margin-top: 28px; }
  .tap { width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .linkish { font-size: 14px; font-weight: 700; color: var(--royal); background: none; border: 0; padding: 6px 0; cursor: pointer; }

  .bar { height: 12px; border-radius: 6px; background: var(--tint); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 6px; background: var(--royal); }
  .bar.thin { height: 8px; }
  .bar.amber { background: #EBD9B4; } .bar.amber > div { background: var(--amber-dot); }

  .dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; flex-shrink: 0; }
  .dot.ok { background: var(--ok-dot); }
  .dot.warn { background: var(--amber-dot); padding: 0; border: 0; border-radius: 4px; }   /* not the .warn card */
  .dot.est { border: 2px solid var(--est-dot); }
  .dot.range { background: linear-gradient(90deg, var(--royal) 50%, var(--tint) 50%); border: 1px solid var(--royal); }

  .line-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); background: none; }
  .line-item:last-child { border-bottom: 0; }
  .line-item .name { font-size: 16px; font-weight: 600; display: block; }
  .line-item .meta { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .line-item .meta.warn-t { color: var(--amber-text); }
  .line-item .meta.est-t { color: var(--est); }
  .line-item .amt { font-size: 17px; font-weight: 700; white-space: nowrap; }
  .line-item .amt.est-t { color: var(--est); }

  .chip { min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--chip-line); background: var(--white); color: var(--royal); font-size: 15px; font-weight: 600; cursor: pointer; }
  .chip.on { border-color: var(--royal); background: var(--royal); color: var(--white); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }

  .primary { min-height: 54px; border-radius: 999px; border: 0; background: var(--royal); color: var(--white); font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; }
  .primary:disabled { background: #9DB5DE; cursor: default; }
  .secondary { min-height: 48px; border-radius: 999px; border: 1px solid var(--chip-line); background: var(--white); color: var(--royal); font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .legend { font-size: 14px; font-weight: 600; color: var(--muted); }
  .input { min-height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--field-line); background: var(--white); font-size: 17px; width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; color: var(--navy); font-family: inherit; }
  /* dates look like every other field (iPhone draws them centered and wider by default) */
  .input[type="date"] { -webkit-appearance: none; appearance: none; display: block; text-align: left; line-height: 50px; height: 52px; }
  .input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  .input[type="date"]::-webkit-calendar-picker-indicator { opacity: .55; }
  select.input { -webkit-appearance: none; appearance: none; }
  .preview-card .body { color: var(--navy); margin: 0; }
  .preview-card .ph { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .more-toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 48px; padding: 0 16px; border-radius: 16px; border: 1px dashed var(--chip-line); background: transparent; color: var(--royal); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; text-align: left; }
  .more-toggle .sum { font-size: 13px; font-weight: 500; color: var(--muted); }
  .input:focus, .money input:focus { outline: 2px solid var(--royal); outline-offset: 1px; }
  .money { display: flex; align-items: center; gap: 4px; padding: 8px 18px; border-radius: 20px; background: var(--white); border: 1px solid var(--field-line); }
  .money span { font-size: 40px; font-weight: 800; color: var(--muted); }
  .money input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 40px; font-weight: 800; outline: none; border-radius: 8px; }
  .seg { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; padding: 4px; border-radius: 999px; background: var(--tint); }
  .seg button { min-height: 44px; border-radius: 999px; border: 0; background: transparent; color: var(--muted-2); font-size: 15px; font-weight: 700; cursor: pointer; }
  .seg button.on { background: var(--white); color: var(--navy); box-shadow: 0 1px 2px rgba(14,36,64,.12); }

  .option { display: flex; gap: 12px; padding: 16px; border-radius: 18px; background: var(--white); border: 1px solid var(--field-line); }
  .option.on { border: 2px solid var(--royal); padding: 15px; }
  .radio { width: 22px; height: 22px; border-radius: 11px; border: 2px solid #8A9BB8; flex-shrink: 0; display: grid; place-items: center; }
  .option.on .radio { border-color: var(--royal); }
  .option.on .radio::after { content: ""; width: 10px; height: 10px; border-radius: 5px; background: var(--royal); }
  .option .t { font-size: 16px; font-weight: 700; display: block; }
  .option .d { font-size: 14px; color: var(--muted); line-height: 1.45; margin-top: 4px; display: block; }

  .decision { font-size: 20px; font-weight: 800; color: var(--royal); }

  .wave-labels { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); text-align: center; font-size: 12px; gap: 2px; }
  .wave-labels button { background: none; border: 0; padding: 4px 0; cursor: pointer; display: flex; flex-direction: column; gap: 1px; align-items: center; border-radius: 10px; }
  .wave-labels button:hover { background: var(--tint); }
  .wave-labels .d { color: #475768; }
  .wave-scroll { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin: 0 -4px; padding: 14px 4px 0; overscroll-behavior-x: contain; }
  .wave-scroll.more { -webkit-mask-image: linear-gradient(90deg, #000 95%, transparent); mask-image: linear-gradient(90deg, #000 95%, transparent); }
  .pc-arrow[aria-disabled="true"] { opacity: .35; cursor: default; }
  .wave-scroll::-webkit-scrollbar { display: none; }
  .wave-strip { position: relative; }
  .wave-strip .wave-labels button { scroll-snap-align: start; }
  .wave-labels .far .d, .wave-labels .far strong { color: #7C8794; }
  .wave-labels .x { font-size: 10.5px; font-weight: 800; color: var(--royal); background: var(--tint); border-radius: 6px; padding: 1px 5px; margin-top: 2px; }
  .wave-labels .t { color: #475768; font-size: 10.5px; white-space: nowrap; letter-spacing: -.01em; }
  .wave-labels strong.short { color: var(--amber-text); }
  .pc-track { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 2px 2px 8px; margin: 0 -2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .pc-track::-webkit-scrollbar { display: none; }
  .pc-track::after { content: ''; flex: 0 0 calc(38% - 10px); }   /* room for the last card to come fully into view */
  .pc-card { flex: 0 0 62%; min-width: 0; scroll-snap-align: start; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--white); color: var(--navy); font: inherit; cursor: pointer; }
  .pc-card.short { background: var(--amber-bg); border-color: var(--amber-line); }
  .pc-date { font-size: 13px; font-weight: 700; color: var(--muted-2); }
  .pc-room { font-size: 24px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
  .pc-card.short .pc-room { color: var(--amber-text); }
  .pc-sub { font-size: 13px; color: var(--muted); }
  .pc-sub em { font-style: normal; font-weight: 700; color: var(--muted-2); white-space: nowrap; }
  .pc-badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .pc-badge { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--tint); color: var(--royal); }
  .pc-badge.warm { background: #FBEBD0; color: var(--amber-text); }
  .pc-badge.plain { background: #EEF1F5; color: var(--muted-2); }
  .pc-items { display: flex; flex-direction: column; gap: 4px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
  .pc-items .row span:last-child { font-variant-numeric: tabular-nums; }
  .pc-tag { margin-top: 4px; font-size: 12px; font-weight: 700; line-height: 1.3; padding: 4px 8px; border-radius: 8px; background: var(--tint); color: var(--royal); align-self: flex-start; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pc-tag.warm { background: #FBEBD0; color: var(--amber-text); }
  .pc-tag.plain, .pc-tag.bill { background: #EEF1F5; color: var(--muted-2); }
  .pc-more { font-weight: 800; opacity: .75; }
  .pc-nav { display: flex; align-items: center; gap: 4px; }
  .pc-arrow { width: 44px; height: 44px; margin: -6px -4px; border: 0; background: none; display: grid; place-items: center; color: var(--royal); cursor: pointer; border-radius: 50%; }
  .pc-arrow svg { width: 32px; height: 32px; padding: 7px; border-radius: 50%; border: 1px solid var(--chip-line); background: var(--white); box-sizing: border-box; }
  .legend-row { display: flex; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }
  .legend-row span { display: flex; align-items: center; gap: 6px; }

  .dock { position: sticky; bottom: 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); background: var(--ivory); display: flex; flex-direction: column; gap: 10px; border-top: 1px solid rgba(213,223,238,.7); z-index: 5; }
  .ask { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px; border-radius: 999px; background: var(--tint); margin: 0; }
  .ask input { flex: 1; border: 0; background: transparent; font-size: 16px; outline: none; min-width: 0; }
  .send { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--royal); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }

  .scrim { position: fixed; inset: 0; background: rgba(14,36,64,.32); display: flex; align-items: flex-end; justify-content: center; z-index: 40; }
  .sheet { width: 100%; max-width: 430px; background: var(--ivory); border-radius: 28px 28px 0 0; padding: 24px 24px calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
  .toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--navy); color: var(--white); padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 50; max-width: 340px; text-align: center; line-height: 1.4; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- the wave rail: contextual actions at the thumb edge ---------- */
  /* The wave rail is part of the screen edge: a thin navy band that runs the full height
     and swells into a pocket around the knob. Labels are upright pills read bottom to top. */
  .has-rail .pad { padding-right: 70px; }
  .has-rail.left .pad { padding-left: 70px; padding-right: 24px; }
  #rail-wrap { position: absolute; inset: 0; pointer-events: none; z-index: 15; }
  .rail { position: absolute; top: 0; bottom: 0; right: 0; width: 64px; }
  .left .rail { right: auto; left: 0; }
  .rail-sea { position: absolute; inset: 0; pointer-events: none; }
  .left .rail-sea { transform: scaleX(-1); }
  .rail-sea svg { position: absolute; top: 0; right: 0; }
  .wave-layer { animation: alon-drift linear infinite; will-change: transform; }
  @keyframes alon-drift { from { transform: translateY(calc(-1 * var(--len))); } to { transform: translateY(0); } }
  .prep-chart.settle svg { animation: alon-settle .45s cubic-bezier(.2,.7,.3,1); transform-origin: 50% 100%; }
  @keyframes alon-settle { 0% { transform: scaleY(1.06); } 60% { transform: scaleY(.985); } 100% { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .wave-layer, .prep-chart.settle svg { animation: none; } }
  .top { z-index: 20; }               /* the header and its buttons sit above the water */
  .dock { z-index: 16 !important; }   /* the water runs under the ask bar */
  .rail-slot, .rail-knob { pointer-events: auto; position: absolute; right: 4px; padding: 0; font-family: inherit; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; display: grid; place-items: center; }
  .rail-slot span, .rail-knob span { pointer-events: none; white-space: nowrap; }
  .rail-slot { width: 58px; height: 44px; border: 0; border-radius: 22px; background: none; color: var(--navy); }
  .rail-slot:hover { background: rgba(22,89,208,.08); }
  .rail-slot[data-blocked] { color: #8A9BB8; }
  .rail-knob { width: 60px; height: 40px; border: 0; border-radius: 20px; background: var(--royal); color: #fff; box-shadow: 0 6px 16px rgba(22,89,208,.35); cursor: grab; touch-action: none; }
  .rail-knob.dragging { cursor: grabbing; }
  .rail-knob[data-blocked] { background: #9DB5DE; box-shadow: none; cursor: default; }
  .left .rail-slot, .left .rail-knob { right: auto; left: 4px; }
  .rail-slot:focus-visible, .rail-knob:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
  .rail-hint { position: absolute; right: 70px; width: 150px; background: var(--navy); color: #fff; font-size: 13px; font-weight: 600; line-height: 1.35; padding: 10px 12px; border-radius: 12px; box-shadow: 0 8px 24px rgba(14,36,64,.2); }
  .rail-hint::after { content: ""; position: absolute; right: -6px; top: 18px; border: 6px solid transparent; border-right: 0; border-left-color: var(--navy); }
  .left .rail-hint { right: auto; left: 70px; }
  .left .rail-hint::after { right: auto; left: -6px; border-left: 0; border-right: 6px solid var(--navy); border-left-color: transparent; }

  /* Now: the hero speaks; everything around it whispers */
  .spec { display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .spec dt { margin: 0; } .spec dd { margin: 0; color: var(--navy); }
  .spec-link { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; background: none; border: 0; padding: 2px 0; cursor: pointer; text-decoration: underline dotted #8FB0EA 1.5px; text-underline-offset: 3px; }
  .hero.big { font-size: 96px; letter-spacing: -.05em; }
  .hero.big.range { font-size: 46px; letter-spacing: -.03em; }
  .hero-sub { font-size: 16px; font-weight: 600; }
  /* V3 look: purpose first, calm status, cards with icon tiles */
  .quick-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .quick { min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--white); border: 1px solid var(--chip-line); color: var(--royal); font-size: 14px; font-weight: 700; cursor: pointer; }
  .hello { font-size: 16px; font-weight: 600; color: var(--muted-2); }
  .status-pill { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 5px 14px 5px 5px; border-radius: 999px; background: var(--white); border: 1px solid var(--line); font-size: 14px; font-weight: 700; color: var(--navy); }
  .status-pill .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .status-pill.ok .ic { background: var(--ok-dot); }
  .status-pill.tight .ic { background: var(--tint); }
  .status-pill.short { background: var(--amber-bg); border-color: var(--amber-line); color: var(--amber-text); }
  .status-pill.short .ic { background: var(--amber-dot); }
  .facts { margin: 0; font-size: 14px; color: var(--muted-2); line-height: 1.5; }
  .facts .spec-link { font-weight: 700; color: var(--navy); text-transform: none; letter-spacing: 0; }
  .tile { width: 40px; height: 40px; border-radius: 12px; background: var(--tint); display: grid; place-items: center; flex: none; }
  .tile.warm { background: var(--amber-bg); }
  .row-card { background: var(--white); border: 1px solid var(--line); border-radius: 20px; padding: 0 14px; }
  .row-card .line-item .lead { display: flex; align-items: center; gap: 12px; min-width: 0; text-align: left; }
  .row-card .line-item .end { display: flex; align-items: center; gap: 8px; flex: none; }

const PERSONA_ORDER = ['salaried', 'hourly', 'gig', 'retiree', 'reservist'];

const clone = x => JSON.parse(JSON.stringify(x));

  return {

    menuOpen: false,

    sources: clone(custom ? seed.sources : p.sources),   // income sources: editable
    onHand: custom ? seed.onHand : p.onHand,             // what's in the account now (estimate), or null
    onHandDate: day,                                     // on-hand money counts only on the day it was entered
    incomeForm: null,                // the income being added or edited

let state = freshState(null);
const persona = () => (state.persona === 'custom' && state.custom) ? state.custom.meta : PERSONAS[state.persona && state.persona !== 'custom' ? state.persona : 'salaried'];

/* ---------- dates ---------- */
const parse = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const parts = t => { const x = new Date(t); return [x.getUTCFullYear(), x.getUTCMonth(), x.getUTCDate()]; };
const daysIn = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
const addDays = (t, n) => t + n * DAY;
function addMonths(t, n, anchorDay) {
  let [y, m] = parts(t);
  m += n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  return Date.UTC(y, m, Math.min(anchorDay, daysIn(y, m)));

const iso = t => new Date(t).toISOString().slice(0, 10);
const short = t => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
const long = t => new Date(t).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
const withYear = t => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });

/* ---------- money ---------- */
const money = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const range = (lo, hi) => lo === hi ? money(lo) : (lo < 0 ? `${money(lo)} to ${money(hi)}` : `${money(lo)}–${money(hi).slice(1)}`);
const round5 = n => Math.ceil(n / 5) * 5;
/* Exact amounts for payment plans: cents when there are cents ($37.50), whole dollars otherwise. */
const moneyExact = n => { const c = Math.round(n * 100) / 100; return Number.isInteger(c) ? money(c) : (c < 0 ? '−$' : '$') + Math.abs(c).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/, ','); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (list, f) => list.reduce((s, x) => s + f(x), 0);

/* ---------- recurrence: rule -> dated occurrences in [from, to) ---------- */
function occurrences(rule, from, to) {
  const start = parse(rule.start);
  const anchor = parts(start)[2];
  const out = [];
  if (rule.freq === 'once') { if (start >= from && start < to) out.push(start); return out; }
  if (rule.freq === 'weekly' || rule.freq === 'biweekly') {
    const step = rule.freq === 'weekly' ? 7 : 14;
    for (let t = start; t < to; t = addDays(t, step)) if (t >= from) out.push(t);
    return out;
  }
  if (rule.freq === 'semimonthly') {
    const other = rule.day2 || (anchor <= 15 ? anchor + 15 : anchor - 15);
    const days = [Math.min(anchor, other), Math.max(anchor, other)];
    let [y, m] = parts(start);
    for (let i = 0; i < 60 && Date.UTC(y, m, 1) < to; i++) {
      days.forEach(d => {
        const t = Date.UTC(y, m, Math.min(d, daysIn(y, m)));
        if (t >= start && t >= from && t < to) out.push(t);
      });
      m++; if (m > 11) { m = 0; y++; }
    }
    return out;
  }
  const step = { monthly: 1, quarterly: 3, semiannual: 6, yearly: 12 }[rule.freq];
  for (let i = 0; i < 400; i++) {
    if (rule.count && i >= rule.count) break;            // a payment plan: only this many payments
    const t = addMonths(start, i * step, anchor);
    if (t >= to) break;
    if (t >= from) out.push(t);
  }
  return out;
}

/* ---------- bills paid in parts ----------
   A bill can carry a plan: the way it's actually paid. Each time the bill comes due (each
   "cycle"), its amount is split into parts on their own dates, plus any fee for splitting,
   plus a monthly membership if the service charges one. The parts REPLACE the original
   payment, so a split rent is never counted twice.
     plan = { parts, every: 'monthly'|'biweekly'|'weekly'|'semimonthly', day2, first,
              fee, feePct, feeOf, feeOnce, membership, since, kind }
   Fees, all optional and in any mix:
     fee       a dollar amount each time it's split
     feePct    a percent each time it's split, of the whole bill (feeOf 'bill') or of the
               part paid later (feeOf 'later'), the way some split services charge
     feeOnce   one time, when the plan starts (a sign-up or set-up fee)
     membership  every month from the start, until it's cancelled
   A plan on its own (a pay-later purchase, a payment plan, a paycheck advance) is a one-time
   bill for the balance left, starting on the next payment, with the same plan. */
function splitAmounts(total, n, first) {
  const cents = v => Math.round(v * 100) / 100;
  if (n <= 1) return [cents(total)];
  if (first > 0 && first < total) return [cents(first)].concat(splitAmounts(total - first, n - 1, 0));
  const each = Math.ceil(total * 100 / n) / 100;
  return Array.from({ length: n }, (_, i) => i < n - 1 ? each : cents(total - each * (n - 1)));
}
/* Amounts per payment: what's typed is kept; blank ones share what's left equally. */
function resolveAmounts(total, n, typed) {
  const t = (typed || []).slice(0, n).map(v => { const x = parseMoney(v); return x > 0 ? Math.round(x * 100) / 100 : null; });
  while (t.length < n) t.push(null);
  const fixed = Math.round(sum(t.filter(v => v != null), v => v) * 100) / 100, blanks = t.filter(v => v == null).length;
  if (fixed > total + 0.004) return { ok: false, problem: `The payments add up to ${moneyExact(fixed)}, more than ${moneyExact(total)}.` };
  if (!blanks && Math.abs(fixed - total) > 0.004) return { ok: false, problem: `The payments add up to ${moneyExact(fixed)}; they need to add up to ${moneyExact(total)}.` };
  const share = blanks ? splitAmounts(Math.round((total - fixed) * 100) / 100, blanks, 0) : [];
  let k = 0;
  return { ok: true, amounts: t.map(v => v != null ? v : share[k++]) };
}
/* Paydays of the main income, before and after the dates it was entered from. */
function paydayRuleOf(p) {
  if (p && p.payRule) return p.payRule;
  const own = p && p.paySource && state.sources.find(x => x.id === p.paySource);
  return own || primarySource();
}
function paydaysBetween(rule, from, to) {
  if (!rule || rule.freq === 'once') return [];
  const s = parse(rule.start), day = parts(s)[2];
  const back = rule.freq === 'weekly' ? addDays(s, -7 * 60) : rule.freq === 'biweekly' ? addDays(s, -14 * 30) : addMonths(s, -14, day);

    return lines.join('. ') + '.' + (low ? ` That would make another ${unit} short instead.` : '');
  };
  const opts = [];
  /* Balanced: take from the paychecks with the most room first, so what's left in each
     ends up as even as possible ("water-filling"). Rounded up to $5 so the gap is covered. */
  const rooms = prep.map(i => Math.max(0, ws[i].roomLow));
  const totalRoom = sum(rooms, r => r);
  if (prep.length > 1 && totalRoom >= gap) {
    let lo = 0, hi = Math.max(...rooms);
    for (let n = 0; n < 60; n++) { const mid = (lo + hi) / 2; if (sum(rooms, r => Math.max(0, r - mid)) > gap) lo = mid; else hi = mid; }
    let allocs = prep.map((i, n) => ({ from: i, to: k, amount: Math.floor(Math.max(0, rooms[n] - hi) / 5) * 5 })).filter(a => a.amount > 0);
    let short5 = gap - sum(allocs, a => a.amount);
    for (const a of allocs.slice().sort((x, y) => (ws[y.from].roomLow - y.amount) - (ws[x.from].roomLow - x.amount))) {
      if (short5 <= 0) break;
      const add = Math.min(round5(short5), Math.floor((ws[a.from].roomLow - a.amount) / 5) * 5);
      a.amount += add; short5 -= add;
    }
    if (short5 <= 0 && allocs.length) {
      const level = Math.min(...allocs.map(a => ws[a.from].roomLow - a.amount));
      opts.push({ id: 'balanced', title: allocs.map(a => `${money(a.amount)} from ${short(ws[a.from].start)}`).join(', '),
        detail: `Takes the most from the ${unit}s with the most room, so each one keeps at least ${money(Math.min(level, ...prep.map(i => ws[i].roomLow)))}. ` + describe(allocs), allocs });
    }
  }
  const each = round5(gap / prep.length);
  const evenAllocs = prep.map(i => ({ from: i, to: k, amount: each }));
  opts.push({ id: 'even', title: prep.length > 1 ? `${money(each)} from each of the next ${prep.length} ${unit}s` : `${money(each)} from ${short(ws[prep[0]].start)}`, detail: describe(evenAllocs), allocs: evenAllocs });
  const clear = prep.filter(i => ws[i].roomLow >= 250);
  if (clear.length > 0 && clear.length < prep.length) {
    const e2 = round5(gap / clear.length);
    const allocs = clear.map(i => ({ from: i, to: k, amount: e2 }));
    opts.push({ id: 'clear', title: `${money(e2)} from ${clear.map(i => short(ws[i].start)).join(' and ')}`, detail: `Leaves the narrower ${unit}s alone. ` + describe(allocs), allocs });
  }
  const lastI = prep[prep.length - 1];
  if (prep.length > 1 && ws[lastI].roomLow >= gap) {
    const allocs = [{ from: lastI, to: k, amount: round5(gap) }];
    opts.push({ id: 'last', title: `${money(round5(gap))} from ${short(ws[lastI].start)}`, detail: 'One step, close to the date. ' + describe(allocs), allocs });
  }
  // drop exact duplicates (two strategies can land on the same split)
  const seen = new Set();
  const unique = opts.filter(o => { const key = o.allocs.map(a => a.from + ':' + a.amount).join(','); if (seen.has(key)) return false; seen.add(key); return true; });
  unique.push({ id: 'none', title: 'Leave it as is', detail: totalRoom < gap ? `The ${unit}s before it have ${money(totalRoom)} of room in total, less than the ${money(gap)} gap, so no plan covers all of it. Alon keeps showing it so it isn't a surprise.` : 'Nothing changes. Alon keeps showing the gap so it isn’t a surprise.', allocs: [] });
  return { k, target, gap, prep, opts: unique, totalRoom };
}

/* ---------- preparing for a wave: spread an amount over the paychecks before it ----------
   Takes from the paychecks with the most room first (the same "water-filling" as the balanced
   option), in $5 steps, never more than a paycheck has. Returns the set-asides and the most
   that can be prepared at all. */
function prepAllocs(ws, k, amount) {
  let prep = []; for (let i = 1; i < k; i++) prep.push(i);
  if (!prep.length) prep = [0];
  const rooms = prep.map(i => Math.max(0, Math.floor(ws[i].roomLow / 5) * 5));
  const most = sum(rooms, r => r);
  const X = Math.min(Math.max(0, Math.round(amount / 5) * 5), most);
  if (!X) return { allocs: [], most, prepared: 0, prep };
  let lo = 0, hi = Math.max(...rooms);
  for (let n = 0; n < 60; n++) { const mid = (lo + hi) / 2; if (sum(rooms, r => Math.max(0, r - mid)) > X) lo = mid; else hi = mid; }
  const take = rooms.map(r => Math.floor(Math.max(0, r - hi) / 5) * 5);
  let left = X - sum(take, t => t);
  while (left > 0) {                                   // hand out the last few $5 steps, most room left first
    let best = -1;
    take.forEach((t, n) => { if (rooms[n] - t >= 5 && (best < 0 || rooms[n] - t > rooms[best] - take[best])) best = n; });
    if (best < 0) break;
    take[best] += 5; left -= 5;
  }
  const allocs = prep.map((i, n) => ({ from: i, to: k, amount: take[n] })).filter(a => a.amount > 0);
  return { allocs, most, prepared: sum(allocs, a => a.amount), prep };
}
function prepPreview(ws, k, amount, fixed) {
  const pa = fixed ? { allocs: fixed, most: prepAllocs(ws, k, 1e9).most, prepared: sum(fixed, a => a.amount) } : prepAllocs(ws, k, amount);
  const keep = state.reserves.filter(r => r.done === true);
  const preview = keep.concat(pa.allocs.map((a, n) => ({ id: 'pv' + n, from: iso(ws[a.from].start), to: iso(ws[k].start), amount: a.amount, done: null })));
  return Object.assign(pa, { after: computeWindows(preview), reserves: preview });
}

/* ---------- explanation: why a window is short (deterministic; the AI would only phrase it) ---------- */
function explainWindow(w) {
  const unit = persona().unit;
  const out = [];
  const came = w.items.filter(x => x.bill.surprise);
  if (came.length) out.push(`${listJoin(came.map(x => `${x.bill.name} (${money(x.amount)})`))} came up in this ${unit}${w.drawn ? `; ${money(w.drawn)} of it comes from your savings` : ''}.`);
  const rare = w.items.filter(x => LONG_FREQS.includes(x.bill.freq) && !x.bill.surprise && !x.bill.plan);
  if (came.length) { /* the surprise is the reason; don't also blame the biggest bill */ }
  else if (rare.length) {
    const names = rare.map(x => x.bill.name.toLowerCase());
    const list = names.length === 1 ? names[0] : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
    const without = w.roomLow + sum(rare, x => x.amount);
    out.push(`${rare.length === 1 ? 'A bill that doesn’t' : rare.length + ' bills that don’t'} come every month ${rare.length === 1 ? 'lands' : 'land'} in this ${unit}: ${list}. Without ${rare.length === 1 ? 'it' : 'them'}, ${w.roomLow === w.roomTyp ? 'it' : 'even a lighter ' + unit} would leave about ${money(without)}.`);
  } else {
    const big = [...w.items].sort((a, c) => c.amount - a.amount)[0];
    if (big && big.amount >= 0.5 * Math.max(1, w.incomeLow)) out.push(`${big.bill.name} (${money(big.amount)}) lands in this ${unit}, and it’s more than half of what usually comes in.`);
  }
  const planPays = w.items.filter(x => x.bill.plan && !x.membership);
  const planBills = [...new Set(planPays.map(x => x.bill))];
  if (planBills.length >= 2) out.push(`${planBills.length} payment plans take ${money(sum(planPays, x => x.amount))} from this ${unit}: ${listJoin(planBills.map(b => b.name))}.`);
  if (w.roomLow < 0 && w.roomTyp >= 0) out.push(`On a typical ${unit} it leaves ${money(w.roomTyp)}; on a lighter one it comes up ${money(-w.roomLow)} short.`);
  const uncertain = w.income.filter(x => x.source.certainty === 'uncertain' && x.actual == null);
  if (uncertain.length) out.push(`${uncertain.map(x => x.source.name).join(', ')} isn’t counted until it arrives.`);
  if (!out.length) out.push(`Bills and everyday spending in this ${unit} add up to more than what comes in.`);
  return out.join(' ');
}

/* ---------- set-aside plans: progress toward the period they're for ---------- */
function planGroups() {
  const groups = {};
  state.reserves.forEach(r => {
    const g = groups[r.to] || (groups[r.to] = { to: r.to, planned: 0, ready: 0, skipped: 0, items: [] });
    g.items.push(r);
    if (r.done === false) g.skipped += r.amount; else g.planned += r.amount;
    if (r.done === true) g.ready += r.amount;
  });
  return Object.values(groups).sort((a, b) => parse(a.to) - parse(b.to));
}
const setAsideDueToday = () => state.reserves.filter(r => parse(r.from) === TODAY && r.done == null);

/* ---------- earn-by target (no-regular-paycheck users) ---------- */
function earnBy() {
  const p = persona();
  if (p.unit !== 'week') return null;
  const horizon = addDays(TODAY, 14);
  const occ = [];
  state.bills.forEach(b => billEvents(b, TODAY, horizon).forEach(x => occ.push({ b, t: x.date, amount: x.amount })));
  occ.sort((a, c) => a.t - c.t);
  const big = occ.find(o => o.amount >= 300);
  if (!big) return null;
  const due = sum(occ.filter(o => o.t <= big.t), o => o.amount);
  const have = (state.onHandDate === iso(TODAY) ? state.onHand || 0 : 0) + state.logged;
  return { bill: big.b, date: big.t, due, have, toGo: Math.max(0, due - have) };
}

/* The next six paychecks as the sea seen from a boat. Calm water means a paycheck is fine.
   A swell rises only when one gets tight, and the shorter it is, the higher it rises: its
   height is how far the lighter case falls below "clear" ($250 left). The dotted line is $0;
   any water above it is a paycheck that comes up short, shown warm. With a range, the
   dashed line is the typical case. Nothing moves. */
const CLEAR_AT = 250;
function waveChart(ws) {
  const W = 60 * ws.length, H = 132, calm = 100, top = 22;   // 60 units per paycheck: each crest sits over its date
  const rough = v => Math.max(0, CLEAR_AT - v);
  const lows = ws.map(w => w.roomLow), typs = ws.map(w => w.roomTyp);
  const den = Math.max(500, ...lows.map(rough));              // a fixed floor, so a small dip stays small
  const y = v => calm - rough(v) / den * (calm - top);
  const xs = ws.map((w, i) => 30 + i * 60);
  /* The surface: a smooth line through each paycheck's height, plus the small, steady waves
     of normal life. Those small waves are 20px long and cross zero exactly at every
     paycheck, so each paycheck's height is still exactly its number. */
  const RIPPLE = 2.2, LEN = 30;
  const surface = (vals, dy = 0) => {
    const py = vals.map(v => y(v) + dy);
    const at = x => {
      if (x <= xs[0]) return py[0];
      if (x >= xs[xs.length - 1]) return py[py.length - 1];
      const i = Math.min(xs.length - 2, Math.floor((x - xs[0]) / 60)), t = (x - xs[i]) / 60;
      return py[i] + (py[i + 1] - py[i]) * (1 - Math.cos(Math.PI * t)) / 2;
    };
    let d = '';
    for (let x = -2; x <= W + 2; x += 2) {
      const base = at(x), calmness = Math.max(0, Math.min(1, (base - dy - top) / (calm - top)));   // 1 on calm water, 0 at the top
      d += `${d ? ' L' : 'M'}${x},${(base - RIPPLE * calmness * calmness * Math.sin(2 * Math.PI * (x - xs[0]) / LEN)).toFixed(2)}`;
    }
    return d;
  };
  const body = (vals, dy = 0) => `${surface(vals, dy)} L${W + 2},${H} L-2,${H} Z`;
  const hasRange = ws.some(w => w.roomTyp !== w.roomLow);
  const anyShort = lows.some(v => v < 0);
  const y0 = y(0);
  const uid = 'sea' + Math.round(Math.random() * 1e6);
  // the whitecap: water above the $0 line is foam, with a scalloped edge hanging just under it
  let scallops = `M${W},${y0.toFixed(1)}`;
  for (let x = W; x > 0; x -= 12) scallops += ` Q${(x - 6).toFixed(1)},${(y0 + 8).toFixed(1)} ${(x - 12).toFixed(1)},${y0.toFixed(1)}`;
  const foamEdge = `M0,0 L${W},0 L${W},${y0.toFixed(1)} ${scallops.slice(scallops.indexOf('Q'))} Z`;
  /* A short paycheck breaks: its crest curls forward into a white lip with foam and spray.
     The curl starts level with the crest and only falls from there, so the top of the wave
     is still exactly that paycheck's number. */
  const curl = (cx, cy, s) => {
    const k = Math.min(1, Math.max(.6, s));
    const P = (dx, dy) => `${(cx + dx * k).toFixed(1)},${(cy + dy * k).toFixed(1)}`;
    return `<g>
      <path d="M${P(-16, 8)} C${P(-10, 0)} ${P(-4, 0)} ${P(2, 0)} C${P(14, 0)} ${P(26, 6)} ${P(25, 17)} C${P(24, 25)} ${P(15, 27)} ${P(12, 21)} C${P(10, 17)} ${P(14, 13)} ${P(17, 15)} C${P(14, 9)} ${P(6, 9)} ${P(1, 13)} C${P(-4, 17)} ${P(-10, 16)} ${P(-16, 8)} Z" fill="#fff" stroke="#1659D0" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M${P(-11, 10)} Q${P(-8, 14)} ${P(-5, 11)} Q${P(-2, 15)} ${P(1, 12)}" fill="none" stroke="#B9CFEE" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M${P(5, 3)} C${P(13, 3)} ${P(20, 7)} ${P(21, 14)}" fill="none" stroke="#CFE0F7" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="${(cx + 27 * k).toFixed(1)}" cy="${(cy + 4 * k).toFixed(1)}" r="${(2 * k).toFixed(1)}" fill="#fff" stroke="#1659D0" stroke-width="1"/>
      <circle cx="${(cx + 31 * k).toFixed(1)}" cy="${(cy + 11 * k).toFixed(1)}" r="${(1.4 * k).toFixed(1)}" fill="#fff" stroke="#1659D0" stroke-width=".9"/>
      <circle cx="${(cx - 19 * k).toFixed(1)}" cy="${(cy + 2 * k).toFixed(1)}" r="${(1.6 * k).toFixed(1)}" fill="#fff" stroke="#1659D0" stroke-width=".9"/>
    </g>`;
  };
  const curls = ws.map((w, i) => w.roomLow < 0 ? curl(xs[i], y(w.roomLow), (y0 - y(w.roomLow)) / 22) : '').join('');
  const today = `<circle cx="${xs[0]}" cy="${y(lows[0]).toFixed(1)}" r="4.5" fill="#fff" stroke="#1659D0" stroke-width="2"/>`;
  const label = ws.map(w => `${windowShortName(w)} ${range(w.roomLow, w.roomTyp)}`).join(', ');
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="The next ${ws.length} ${persona().unit}s as the sea: calm when there’s room, a swell when one is tight, a breaking whitecap when one is short. ${label}" style="display:block;border-radius:18px;overflow:visible">
    <defs>
      <linearGradient id="${uid}-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FAEEE"/><stop offset="1" stop-color="#3C78DA"/></linearGradient>

/* ---------- the wave rail ----------
   Where = four dots. Do = this rail. Ask = the bar at the bottom. Now = the screen.
   Three actions per screen; the main one sits in the knob. Tap a label, or slide the
   knob to it. The rail's edge is Alon's wave, and the swell follows the knob. */
const RAIL_W = 64;
let RAIL = { h: 760, slots: [298, 410, 522] };
function railGeom() {
  const h = (typeof app !== 'undefined' && app && app.clientHeight) || 760;
  const c = Math.round(h * 0.54);                 // the thumb's resting height
  RAIL = { h, slots: [c - 90, c, c + 90] };
}
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* An ocean edge in three layers, top to bottom of the screen:
   a pale swell at the back, a brighter wave with a foam line, and the deep navy
   water in front, which opens into a pocket that holds the knob. The back two drift. */
const SEA = [
  { color: '#F1F5FC', base: 17, amp: 5, len: 196, dur: 18 },
  { color: '#E9F0FB', base: 12, amp: 4, len: 148, dur: 12, line: '#D5DFEE' }
];
const crest = th => (Math.sin(th) + 0.34 * Math.sin(2 * th + 0.9)) / 1.26;   // a crest that leans, like a breaking wave
function waveEdge(base, amp, len, h) {
  const pts = [];
  for (let y = 0; y <= h; y += 4) pts.push(`${(RAIL_W - (base + amp * crest(2 * Math.PI * y / len))).toFixed(1)},${y}`);
  return pts;
}
function seaLayer(w) {
  const h = RAIL.h + w.len, edge = waveEdge(w.base, w.amp, w.len, h);
  return `<svg class="wave-layer" width="${RAIL_W}" height="${h}" viewBox="0 0 ${RAIL_W} ${h}" style="--len:${w.len}px;animation-duration:${w.dur}s">
    <path d="M${RAIL_W},0 L${edge.join(' L')} L${RAIL_W},${h} Z" fill="${w.color}"/>
    ${w.line ? `<path d="M${edge.join(' L')}" fill="none" stroke="${w.line}" stroke-width="1" stroke-linejoin="round"/>` : ''}
  </svg>`;
}
function railEdge(ky) {
  const pts = [];
  for (let y = 0; y <= RAIL.h; y += 4) {
    const swell = Math.exp(-Math.pow((y - ky) / 66, 2));                        // a soft swell around the knob
    const water = 7 + 1.5 * crest(2 * Math.PI * y / 110);                        // the edge itself: small waves
    pts.push(`${(RAIL_W - (water * (1 - swell) + 46 * swell)).toFixed(1)},${y}`);
  }
  return pts;
}
function railPath(ky) { return `M${RAIL_W},0 L${railEdge(ky).join(' L')} L${RAIL_W},${RAIL.h} Z`; }
function railLine(ky) { return `M${railEdge(ky).join(' L')}`; }

function railActions() {
  const p = persona();
  const go = (label, screen) => ({ label, attrs: `data-go="${screen}"` });
  const act = (label, action, extra) => Object.assign({ label, attrs: `data-action="${action}"` }, extra || {});
  switch (state.screen) {
    case 'now': {
      const top = smoothing(computeWindows()) ? go('Why', 'why') : go('Ahead', 'waves');
      return p.unit === 'week' ? [top, act('Log', 'log', { aria: 'Log earnings' }), Object.assign(go('Afford?', 'check'), { aria: 'What can I spend?' })]

    }
    case 'detail': return [go('Back', 'now'), Object.assign(go('Afford?', 'check'), { aria: 'What can I spend?' }), go('Add', 'add')];
    case 'waves': return [go('Now', 'now'), go('Prepare', 'why'), go('Add', 'add')];
    case 'why': {
      if (!smoothing(computeWindows())) return [go('Back', 'waves'), go('Now', 'now'), null];
      return [go('Back', 'waves'), act('Plan', 'plan', { disabled: !state.picked && !(state.prepAmt > 0), hint: 'Slide to prepare, or pick an option.' }), act('Leave', 'leave', { aria: 'Leave it as is' })];

    }
    case 'payday': {
      const pay = paydayEvent(computeWindows());
      if (!pay) return [go('Back', 'now'), null, null];
      const fixed = pay.source.certainty === 'fixed';
      if (fixed && state.payAnswer !== 'different') {
        return [{ label: 'Different', attrs: 'data-payday="different"', aria: 'A different amount' },
                { label: 'Landed', attrs: 'data-payday="yes"', aria: `Yes, ${money(pay.source.typical)} landed` },
                { label: 'Not yet', attrs: 'data-payday="notyet"' }];
      }
      return [go('Back', 'now'), act('Confirm', 'confirm-pay', { aria: 'Confirm the amount that landed' }), { label: 'Not yet', attrs: 'data-payday="notyet"' }];
    }
    case 'add': {
      const { valid } = billPreview(state.form);
      const back = state.returnTo || 'now';
      const why = billPreview(state.form);
      return [go('Back', back), act('Save', 'save-bill', { disabled: !valid, hint: why.needsRecent ? 'Answer Paid or Not yet for the earlier payment first.' : state.form.plan && why.note && why.preview === 'Not set yet' ? why.note : 'Add a name and an amount first.', aria: 'Save bill' }),
              state.form.id ? act('Remove', 'remove-bill', { aria: 'Remove this bill' }) : go('Bills', 'bills')];
    }
    case 'bills': return [go('Back', 'now'), go('Add', 'add'), null];
    case 'goals': return [go('Back', 'now'), act('Add', 'add-goal', { aria: 'Add a goal' }), go('Ahead', 'waves')];
    case 'goal-edit': return [go('Back', 'goals'), act('Save', 'save-goal', { disabled: !goalValid(state.goalForm), hint: 'Add a name, a target and a date or amount first.', aria: 'Save goal' }), state.goalForm && state.goalForm.id ? act('Remove', 'remove-goal', { aria: 'Remove this goal' }) : null];
    case 'plan': return [go('Back', state.planBack && state.planBack !== 'plan' ? state.planBack : 'bills'), act('Save', 'save-plan', { disabled: !planValid(state.planForm), hint: 'Add what it’s for, the amount, how many are left and the next date.', aria: 'Save payment plan' }), state.planForm && state.planForm.id ? act('Remove', 'remove-plan', { aria: 'Remove this plan' }) : null];
    case 'surprise': return [go('Back', state.surpriseBack || 'now'), act('Save', 'save-surprise', { disabled: !surpriseValid(state.surpriseForm), hint: 'Add what it is and how much first.', aria: 'Save it to your forecast' }), go('Goals', 'goals')];
    case 'year': return [go('Back', 'now'), act('Share', 'share-year', { aria: 'Share your year card' }), null];
    case 'about': return state.persona ? [go('Back', 'now'), null, null] : null;
    case 'pool': return [go('Back', 'now'), act('Add', 'pool-other', { aria: 'Carry some forward' }), go('Ahead', 'waves')];
    case 'outcome': return [go('Ahead', 'waves'), act('Done', 'outcome-done'), null];
    case 'data': return !state.persona ? null : [go('Back', 'now'), act('Backup', 'backup', { aria: 'Save a backup' }), null];
    case 'feedback': return [go('Back', state.fbFrom || 'now'), act('Send', 'send-feedback', { disabled: !fbValid(), hint: 'Pick one or write a sentence first.', aria: 'Send feedback' }), null];
    case 'income': return [go('Back', 'now'), state.persona === 'reservist' ? act(state.mobilized ? 'Undo' : 'What if', 'mobilize', { aria: state.mobilized ? 'Back to current income' : 'What if I am mobilized' }) : act('Add', 'add-income', { aria: 'Add income' }), go('Bills', 'bills')];
    case 'income-edit': return [go('Back', 'income'), act('Save', 'save-income', { disabled: !incomeValid(state.incomeForm), hint: 'Add a name, an amount and a date first.', aria: 'Save income' }), state.incomeForm && state.incomeForm.id ? act('Remove', 'remove-income', { aria: 'Remove this income' }) : null];
    default: return null;
  }
}

function railHtml() {
  const acts = railActions();
  if (!acts) return '';
  const [t, c, b] = acts;
  const S = RAIL.slots;
  const slot = (a, i) => a ? `<button class="rail-slot" data-slot="${i}" style="top:${S[i] - 22}px" ${a.attrs} ${a.disabled ? 'aria-disabled="true" data-blocked="1"' : ''} data-hint="${esc(a.hint || '')}" aria-label="${esc(a.aria || a.label)}"><span>${a.label}</span></button>` : '';
  const hint = state.railHint && state.screen === 'now' ? `<div class="rail-hint" role="note" style="top:${S[1] - 30}px">Tap or slide the wave for actions.</div>` : '';
  return `<div class="rail" role="toolbar" aria-label="Actions" aria-orientation="vertical">
    <div class="rail-sea" aria-hidden="true">
      ${SEA.map(seaLayer).join('')}
      <svg class="shape" width="${RAIL_W}" height="${RAIL.h}" viewBox="0 0 ${RAIL_W} ${RAIL.h}"><path id="rail-path" d="${railPath(S[1])}" fill="#E8EFFB"/><path id="rail-line" d="${railLine(S[1])}" fill="none" stroke="#C9D6EC" stroke-width="1"/></svg>
    </div>
    ${slot(t, 0)}${slot(b, 2)}
    ${c ? `<button class="rail-knob" id="rail-knob" data-slot="1" data-label="${esc(c.label)}" style="top:${S[1] - 20}px" ${c.attrs} ${c.disabled ? 'aria-disabled="true" data-blocked="1"' : ''} data-hint="${esc(c.hint || '')}" aria-label="${esc(c.aria || c.label)}"><span>${c.label}</span></button>` : ''}
    ${hint}
  </div>`;
}
function updateRail() {
  const wrap = document.getElementById('rail-wrap');
  if (wrap) wrap.innerHTML = railHtml();
}

let railAnim = null;
function setKnob(ky, label) {
  const path = document.getElementById('rail-path'), knob = document.getElementById('rail-knob');
  if (path) path.setAttribute('d', railPath(ky));
  const line = document.getElementById('rail-line'); if (line) line.setAttribute('d', railLine(ky));
  if (knob) { knob.style.top = (ky - 20) + 'px'; const sp = knob.querySelector('span'); if (label != null && sp) sp.textContent = label; }
}
function animateKnob(from, to, label, done) {
  if (railAnim) cancelAnimationFrame(railAnim);
  if (reduceMotion() || from === to) { setKnob(to, label); return done && done(); }
  const t0 = performance.now(), dur = 220;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    setKnob(from + (to - from) * e, label);
    if (k < 1) railAnim = requestAnimationFrame(step); else { railAnim = null; done && done(); }
  };
  railAnim = requestAnimationFrame(step);
}
function slotButton(i) { return document.querySelector(i === 1 ? '#rail-knob' : `.rail-slot[data-slot="${i}"]`); }
function fireRail(i, fromY) {
  const target = slotButton(i);
  if (!target) return;
  const knob = document.getElementById('rail-knob');
  if (target.dataset.blocked) {
    toast(target.dataset.hint || 'Not available yet.');
    return animateKnob(fromY != null ? fromY : RAIL.slots[1], RAIL.slots[1], knob ? knob.dataset.label : null);
  }
  if (state.railHint) state.railHint = false;
  const label = target.textContent;
  animateKnob(fromY != null ? fromY : RAIL.slots[1], RAIL.slots[i], label, () => {
    setTimeout(() => {
      target.dataset.fired = '1';
      target.click();
      delete target.dataset.fired;
      if (document.body.contains(target)) animateKnob(RAIL.slots[i], RAIL.slots[1], (slotButton(1) || {}).dataset ? slotButton(1).dataset.label : null);
    }, i === 1 ? 0 : 60);
  });
}

/* Drag the knob: the wave follows; release on a label to choose it. */
let drag = null, railDraggedAt = -Infinity;   // ignore the click a browser may send right after a drag
function nearestSlot(y) { let n = 0; RAIL.slots.forEach((s, i) => { if (Math.abs(s - y) < Math.abs(RAIL.slots[n] - y)) n = i; }); return n; }
function slotLabel(i) { const b = slotButton(i); return i === 1 ? (b && b.dataset.label) : (b && b.textContent); }
document.addEventListener('pointerdown', e => {
  const knob = e.target.closest && e.target.closest('#rail-knob');
  if (!knob) return;
  drag = { y0: e.clientY, moved: false, ky: RAIL.slots[1], id: e.pointerId };
  try { knob.setPointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dy = e.clientY - drag.y0;
  if (Math.abs(dy) > 6) drag.moved = true;
  if (!drag.moved) return;
  const ky = Math.max(RAIL.slots[0], Math.min(RAIL.slots[2], RAIL.slots[1] + dy));
  drag.ky = ky;
  const knob = document.getElementById('rail-knob');
  if (knob) knob.classList.add('dragging');
  setKnob(ky, slotLabel(nearestSlot(ky)) || (knob && knob.dataset.label));
});

  if (!drag || (e.pointerId != null && e.pointerId !== drag.id)) return;
  const d = drag; drag = null;
  const knob = document.getElementById('rail-knob');
  if (knob) knob.classList.remove('dragging');
  try { if (knob) knob.releasePointerCapture(d.id); } catch (err) {}
  railDraggedAt = performance.now();             // a click may follow; ignore it
  if (!d.moved) return fireRail(1);              // a plain tap on the knob

  const n = nearestSlot(d.ky);
  if (n === 1 || !slotButton(n)) return animateKnob(d.ky, RAIL.slots[1], knob && knob.dataset.label);
  fireRail(n, d.ky);
};
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

/* ---------- screens ---------- */
function screenArrival() {
  return `<header class="top"><div class="brand">${icon.wave}<span>alon</span></div></header>
  <main class="pad">
    <section class="stack gap10 mt24">
      <h1 class="h1" style="font-size:32px">Try an example person</h1>
      <p class="body">Each one shows how Alon adapts to a different way of being paid. You can edit any of their numbers.</p>

    </section>

}

const compact = n => Math.abs(n) >= 1000 ? (n < 0 ? '−' : '') + '$' + (Math.abs(n) / 1000).toFixed(1).replace('.0', '') + 'k' : money(n);

/* Now: one purpose. The number, the wave, and one thing worth knowing. Everything else is one tap away. */
/* Paychecks ahead: one card per paycheck, about six months out. Swipe, or use Previous/Next.
   Further out is less certain, and the cards say so. */
const carouselCount = () => ({ month: 6, week: 13 })[persona().unit] || 14;   // today's plus about six months ahead
function windowBadges(w, extras) {
  const badges = [];
  const ex = extras.find(e => e.extra >= w.start && e.extra < w.end);
  if (ex) badges.push(['tide', `${ordinal(ex.count)} paycheck in ${monthName(ex.month)}`]);
  w.items.filter(x => x.part && x.part === x.parts && (x.bill.freq === 'once' || x.bill.count)).forEach(x => badges.push(['tide', `Last ${x.bill.name} payment`]));
  if (w.inn > 0) badges.push(['tide', `${money(w.inn)} set aside for it`]);
  if (w.poolIn > 0) badges.push(['tide', `Tide pool covers ${money(w.poolIn)}`]);
  if (w.poolOut > 0) badges.push(['plain', `${money(w.poolOut)} to tide pool`]);
  if (w.goalTotal) badges.push(['plain', `${money(w.goalTotal)} to goals`]);
  w.items.filter(x => LONG_FREQS.includes(x.bill.freq) && x.bill.freq !== 'once' && !x.bill.plan).forEach(x => badges.push(['warm', `${x.bill.name}, ${freqLabel(x.bill.freq).toLowerCase()}`]));
  return { badges, ex };
}
/* The arrows and the edge fade follow where the strip is: dim at an end, fade only while there's more. */
function waveEdges() {
  const t = document.getElementById('wave-scroll'); if (!t) return;
  const atStart = t.scrollLeft <= 8, atEnd = t.scrollLeft + t.clientWidth >= t.scrollWidth - 8;
  t.classList.toggle('more', !atEnd);

}
/* Now's paychecks: the wave and its dates scroll together, six at a time, about half a year ahead. */
function waveStrip() {
  const ws = computeWindows(null, carouselCount()), n = ws.length, u = unitWord();
  const extras = extraPaychecks(400);
  const labels = ws.map(w => {
    const far = w.start > addDays(TODAY, 92), { ex } = windowBadges(w, extras);
    return `<button data-window="${w.i}" class="${far ? 'far' : ''}" aria-label="${windowEyebrow(w)}: ${range(w.roomLow, w.roomTyp)}${w.roomLow < 0 ? ' short' : ' left'}${ex ? `, ${ordinal(ex.count)} paycheck this month` : ''}${far ? ', a rough look' : ''}"><span class="d" style="${w.i === 0 ? 'font-weight:700' : ''}">${windowShortName(w)}</span><strong class="${w.roomLow < 0 ? 'short' : ''}">${compact(w.roomLow)}</strong>${w.roomTyp !== w.roomLow ? `<span class="t">to ${compact(w.roomTyp)}</span>` : ''}${ex ? `<span class="x">${ordinal(ex.count)}</span>` : ''}</button>`;
  }).join('');
  return `<div class="wave-scroll" id="wave-scroll" tabindex="0" aria-label="${u === 'week' ? 'Weeks' : 'Paychecks'} ahead. Swipe for more">
      <div class="wave-strip" style="width:${(n / 6 * 100).toFixed(2)}%;--n:${n}">${waveChart(ws)}<div class="wave-labels">${labels}</div></div>
    </div>

}
function extraLine(extras, tail) {
  if (!extras.length) return tail ? `<p class="small" style="margin:0">${tail.trim()}</p>` : '';
  const [y, m] = parts(TODAY);
  const nowMonth = extras[0].month === Date.UTC(y, m, 1);
  const e = nowMonth ? extras[1] : extras[0];
  const head = nowMonth ? `${monthName(extras[0].month)} has ${extras[0].count} paychecks. ` : '';
  return `<p class="small" style="margin:0">${head}${e ? `Next ${e.count}-paycheck month: <strong style="color:var(--navy)">${monthName(e.month)} ${parts(e.month)[0]}</strong>.` : ''}${tail || ''}</p>`;
}
function screenNow() {
  const p = persona();
  const ws = computeWindows();
  const w0 = ws[0];
  const sm = smoothing(ws);
  const isRange = w0.roomLow !== w0.roomTyp;
  const pay = paydayEvent(ws);
  const eb = earnBy();

  let top = '';
  if (pay && pay.actual == null) {
    top = `<button class="tint tap row mt8" style="border:0;padding:12px 14px" data-go="payday">

/* "Prepare for the wave": move the amount and watch the wave come down. It's a preview until
   Plan is pressed, and the money only counts as set aside once it's confirmed on payday. */
function prepCard(ws, sm) {
  const u = unitWord(), k = sm.k, target = ws[k];
  const need = round5(-target.roomLow);
  const pv = prepNow(ws, sm);
  const max = Math.min(need, pv.most);
  return `<div class="card stack gap12">
    <span class="eyebrow" style="color:var(--royal)">Prepare for the wave</span>
    <div id="prep-chart" class="prep-chart">${waveChart(pv.after)}</div>
    <div class="row"><span class="small" style="font-weight:700">Amount prepared</span><span id="prep-val" style="font-size:18px;font-weight:800">${money(pv.prepared)} <span class="small" style="font-weight:600">of ${money(need)}</span></span></div>
    <input type="range" id="prep-range" data-prep min="0" max="${max}" step="5" value="${Math.min(pv.prepared, max)}" aria-label="Amount to prepare for ${windowShortName(target)}" style="width:100%;accent-color:var(--royal)">
    <p id="prep-text" class="small" style="margin:0;line-height:1.5">${prepText(ws, k, pv, need)}</p>
    <span class="small" style="color:var(--muted)">A preview. Nothing is set aside until you plan it, and you move the money yourself.</span>
  </div>`;
}
function prepText(ws, k, pv, need) {
  const u = unitWord(), name = windowShortName(ws[k]);
  const from = pv.allocs.map(a => `${money(a.amount)} from ${windowShortName(ws[a.from])}`);
  const cap = pv.most < need ? ` The ${u}s before it have ${money(pv.most)} of room in total, so that’s the most you can prepare here.` : '';
  if (!pv.prepared) return `Slide to set money aside from the ${u}s before ${name}. The wave comes down as you do.${cap}`;
  if (pv.prepared >= need) return `<strong style="color:var(--navy)">${name} is covered.</strong> ${listJoin(from)}. Press Plan on the wave to keep it.`;
  return `${money(need - pv.prepared)} still to cover. ${listJoin(from)}.${cap}`;
}
let prepWasCovered = false;
function prepNow(ws, sm) {
  const o = state.picked && sm.opts.find(x => x.id === state.picked);
  return o ? prepPreview(ws, sm.k, 0, o.allocs) : prepPreview(ws, sm.k, state.prepAmt || 0);
}
function refreshPrep() {
  const ws = computeWindows(), sm = smoothing(ws);
  if (!sm) return;
  const need = round5(-ws[sm.k].roomLow);
  const pv = prepNow(ws, sm);
  const chart = document.getElementById('prep-chart');
  chart.innerHTML = waveChart(pv.after);
  const covered = pv.prepared >= need;
  if (covered && !prepWasCovered && !reduceMotion()) { chart.classList.remove('settle'); void chart.offsetWidth; chart.classList.add('settle'); }
  prepWasCovered = covered;
  document.getElementById('prep-val').innerHTML = `${money(pv.prepared)} <span class="small" style="font-weight:600">of ${money(need)}</span>`;
  document.getElementById('prep-text').innerHTML = prepText(ws, sm.k, pv, need);
  updateRail(); save();
}

/* "What can I spend?": room in this window, minus a cushion the person chooses, rounded down to $5.
   Planned on the lighter case; the typical case is shown beside it. */
function spendRoom(ws) {
  const w0 = ws[0], c = Number(state.cushion) || 0;
  const floor5 = n => Math.max(0, Math.floor(n / 5) * 5);
  return { w0, c, freeLow: floor5(w0.roomLow - c), freeTyp: floor5(w0.roomTyp - c), ahead: ws.slice(1).find(w => w.roomLow < 0) || null };
}
function checkNumbers(w0, amt) {
  const p = persona();
  const aLow = w0.roomLow - amt, aTyp = w0.roomTyp - amt;
  const until = p.unit === 'week' ? `the end of the week` : short(w0.end);
  let explain;
  if (w0.roomLow < 0) explain = `This ${p.unit} could already come up ${money(-w0.roomLow)} short before this purchase.`;
  else if (aLow >= 150) explain = `This fits, even on a lighter ${p.unit}, and leaves at least ${money(aLow)} for anything unexpected before ${until}.`;
  else if (aLow >= 0) explain = `This fits, but on a lighter ${p.unit} it leaves only ${money(aLow)} for anything unexpected before ${until}.`;
  else if (aTyp >= 0) explain = `On a typical ${p.unit} this fits with ${money(aTyp)} left. On a lighter one it’s ${money(-aLow)} more than what’s left.`;
  else explain = `This is ${money(-aTyp)} more than what’s left, even on a typical ${p.unit}. It would come from money set for bills or everyday spending.`;
  return { aLow, aTyp, explain };
}

function billPreview(f) {

    const last = ev[ev.length - 1];

/* ===================== Something came up =====================
   An unexpected bill: a car repair, a doctor's bill, a furnace, a burst pipe. Alon adds it
   like any bill, shows what it does to the next paychecks, and lays out ways to cover it:
   the surprise fund, money saved for goals, skipping goal set-asides while it's paid.
   Money taken from savings lands on the day of the payment, because nothing carries over
   between paychecks. Alon never lends; when nothing covers it, it says so and keeps showing it. */
const SURPRISE_KINDS = [['car', 'Car repair'], ['medical', 'Medical bill'], ['home', 'Home repair'], ['other', 'Something else']];
const PART_CHOICES = [2, 3, 4, 6, 12];
const unitWord = () => persona().unit === 'month' ? 'window' : persona().unit;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const listJoin = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
function freshSurpriseForm(kind) {
  const k = SURPRISE_KINDS.find(x => x[0] === kind);
  return { kind: k ? k[0] : null, name: k && k[0] !== 'other' ? k[1] : '', amount: '', due: iso(TODAY), parts: 1,
           cover: { fund: savedIn(fundGoals()) > 0, goals: false, skip: false }, fundUse: null, goalsUse: null };
}
function withState(patch, fn) {
  const kept = {}; Object.keys(patch).forEach(k => { kept[k] = state[k]; state[k] = patch[k]; });
  try { return fn(); } finally { Object.assign(state, kept); }
}
const savedIn = list => sum(list, g => Math.max(0, g.saved || 0));
const fundGoals = () => (state.goals || []).filter(g => g.fund);
const otherSavedGoals = () => (state.goals || []).filter(g => !g.fund && (g.saved || 0) > 0);
function windowStartOf(t) { return windowStarts(t).filter(s => s <= t).pop(); }
function surpriseValid(f) { return !!(f && f.name.trim() && parseMoney(f.amount) > 0 && /^\d{4}-\d{2}-\d{2}$/.test(f.due || '')); }

/* Apply the surprise and the chosen ways to cover it to copies of the bills, goals and
   draws. Nothing in state changes until Save. */
function surpriseBuild(f, sid) {
  const amount = parseMoney(f.amount) || 0;
  const n = Math.max(1, Number(f.parts) || 1);
  const each = n > 1 ? Math.ceil(amount / n) : amount;           // rounded up to the dollar, never under
  const due = iso(Math.max(parse(f.due), TODAY));
  const bill = { id: 'b' + sid, name: f.name.trim(), amount: each, freq: n > 1 ? 'monthly' : 'once', start: due, status: 'confirmed', surprise: sid };
  if (n > 1) bill.count = n;
  const fee = n > 1 ? parseMoney(f.partFee) || 0 : 0;
  const payments = occurrences(bill, parse(due), addDays(parse(due), 800)).map(t => ({ t, left: each }));
  const goals = clone(state.goals || []);
  const bills = state.bills.concat([bill], fee ? [{ id: 'bf' + sid, name: `${bill.name} · fee`, amount: fee, freq: 'once', start: due, status: 'confirmed', surprise: sid }] : []);
  const draws = (state.draws || []).slice();
  const added = { skips: {}, drawn: {} };
  const view = () => withState({ bills, goals, draws }, computeWindows);
  const res = { amount, n, each, due, bill, fee, payments, goals, bills, draws, added, skipFree: 0, fundUsed: 0, goalsUsed: 0, needed: 0 };

  // 1. Skip what goes to goals in the paychecks where a payment lands.
  if (f.cover.skip) {
    const before = view();
    const starts = [...new Set(payments.map(p => iso(windowStartOf(p.t))))];
    goals.forEach(g => {
      if (g.paused || goalPlan(g).done) return;
      const add = starts.filter(s => !(g.skips || []).includes(s) && (g.hist || {})[s] == null);
      if (add.length) { g.skips = (g.skips || []).concat(add); added.skips[g.id] = add; }
    });
    const after = view();
    res.skipFree = before.reduce((t, w, i) => t + (payments.some(p => p.t >= w.start && p.t < w.end) ? w.goalTotal - after[i].goalTotal : 0), 0);
  }
  // Take money from savings: payments in short paychecks first, then the rest by date.
  const allocate = (pool, total) => {
    let toUse = Math.min(total, savedIn(pool));
    const ws = view();
    const shortAt = p => { const w = ws.find(x => p.t >= x.start && p.t < x.end); return w ? w.roomLow < 0 : false; };
    const order = payments.filter(p => p.left > 0).sort((a, b) => (shortAt(b) - shortAt(a)) || a.t - b.t);
    let used = 0;
    for (const p of order) for (const g of pool) {
      if (toUse <= 0 || p.left <= 0) break;
      const take = Math.min(p.left, toUse, Math.max(0, g.saved || 0));
      if (take <= 0) continue;
      g.saved -= take; p.left -= take; toUse -= take; used += take;
      added.drawn[g.id] = (added.drawn[g.id] || 0) + take;
      draws.push({ id: 'd' + sid + '_' + draws.length, goalId: g.id, name: g.name, date: iso(p.t), amount: take, surprise: sid });
    }
    return used;
  };
  // 2. The surprise fund: by default, as much of the bill as it holds.
  if (f.cover.fund) {
    const pool = goals.filter(g => g.fund);
    res.fundUsed = allocate(pool, f.fundUse == null ? Math.min(savedIn(pool), amount) : (parseMoney(f.fundUse) || 0));
  }
  // 3. Money saved for other goals: by default, only what keeps these paychecks out of the red.
  {
    const ws = view();
    res.needed = sum(ws, w => {
      const here = payments.filter(p => p.t >= w.start && p.t < w.end);
      return here.length && w.roomLow < 0 ? Math.min(-w.roomLow, sum(here, p => p.left)) : 0;
    });
  }
  if (f.cover.goals) {
    const pool = goals.filter(g => !g.fund && (g.saved || 0) > 0).sort((a, b) => (b.saved || 0) - (a.saved || 0));
    if (f.goalsUse != null) res.goalsUsed = allocate(pool, parseMoney(f.goalsUse) || 0);
    else {
      // Only what's needed. Taking from a goal with a date raises what it needs each paycheck,
      // so check again and top up until these paychecks are clear or the savings run out.
      for (let k = 0, need = res.needed; k < 6 && need > 0; k++) {
        const got = allocate(pool, need);
        res.goalsUsed += got;
        if (!got) break;
        const ws = view();
        need = sum(ws, w => { const here = payments.filter(p => p.t >= w.start && p.t < w.end); return here.length && w.roomLow < 0 ? Math.min(-w.roomLow, sum(here, p => p.left)) : 0; });
      }
    }
  }
  res.after = view();
  return res;
}

/* Everything the screen shows, from the engine's numbers. */
function surpriseView(f) {
  if (!surpriseValid(f)) return { valid: false };
  const u = unitWord();
  const base = computeWindows();
  const none = { fund: false, goals: false, skip: false };
  const plain = surpriseBuild(Object.assign({}, f, { cover: none }), 'x');
  const b = surpriseBuild(f, 'x');
  const mid = plain.after, after = b.after;
  const changedRows = ws => base.map((w, i) => ({ w, before: w.roomLow, after: ws[i].roomLow })).filter(r => r.after !== r.before);
  const when = b.n > 1 ? `${b.n} payments of ${money(b.each)}, monthly from ${short(parse(b.due))}${b.fee ? `, plus a ${money(b.fee)} fee` : ''}` : `${money(b.amount)} on ${short(parse(b.due))}`;
  const worse = ws => ({
    made: ws.filter((w, i) => w.roomLow < 0 && base[i].roomLow >= 0),
    deeper: ws.filter((w, i) => w.roomLow < base[i].roomLow && base[i].roomLow < 0) });
  const worseText = (x, lead) => [
    x.made.length ? `${lead}${listJoin(x.made.map(w => `${windowShortName(w)} ${money(-w.roomLow)} short`))}.` : '',
    x.deeper.length === 1 ? `${windowShortName(x.deeper[0])}, already short, would be ${money(-x.deeper[0].roomLow)} short instead of ${money(-base[x.deeper[0].i].roomLow)}.`
      : x.deeper.length ? `${x.deeper.length} ${u}s that were already short get deeper.` : ''
  ].filter(Boolean).join(' ');
  const m = worse(mid);
  const impact = `${when}. ` + (m.made.length || m.deeper.length ? worseText(m, 'On its own, it would leave ') : `Your ${u}s can absorb it; none comes up short because of it.`);

  // What each way of covering it changes for the goals behind it.
  const goalWas = id => (state.goals || []).find(g => g.id === id);
  const effects = [];
  Object.entries(b.added.drawn).forEach(([id, amt]) => {
    const old = goalWas(id), now = b.goals.find(g => g.id === id);
    const p0 = goalPlan(old), p1 = withState({ goals: b.goals, draws: b.draws, bills: b.bills }, () => goalPlan(now));
    let tail = '';
    if (now.paused) tail = ' It’s paused, so it won’t refill until you turn it back on.';
    else if (now.mode === 'amount') tail = now.fund
      ? ` It refills at ${money(p1.per)} a ${u}, full again about ${p1.finish ? monthYear(p1.finish) : 'later'}.`
      : ` Reached about ${p1.finish ? monthYear(p1.finish) : 'later'}${p0.finish && !p0.done ? ` instead of ${monthYear(p0.finish)}` : ''}.`;
    else tail = ` To still reach it by ${withYear(parse(now.by))}: ${money(p1.per)} a ${u}${p0.done ? '' : ` instead of ${money(p0.per)}`}.`;
    effects.push(`${esc(now.name)}: ${money(old.saved || 0)} → ${money(now.saved)}.${tail}`);
  });
  Object.entries(b.added.skips).forEach(([id, dates]) => {
    if (b.added.drawn[id]) return;                                   // already described above
    const old = goalWas(id), now = b.goals.find(g => g.id === id);
    const p0 = goalPlan(old), p1 = goalPlan(now);
    effects.push(`${esc(now.name)} skips ${plural(dates.length, u)}. ${now.mode === 'amount' ? `Reached about ${p1.finish ? monthYear(p1.finish) : 'later'} instead of ${p0.finish ? monthYear(p0.finish) : 'later'}.` : `The rest goes up to ${money(p1.per)} a ${u}.`}`);
  });

  const a = worse(after);
  const stillShort = a.made.concat(a.deeper);
  const fundSaved = savedIn(fundGoals()), otherSaved = savedIn(otherSavedGoals());
  const activeGoals = (state.goals || []).some(g => !g.paused && !goalPlan(g).done);
  const anyCover = f.cover.fund || f.cover.goals || f.cover.skip;
  const payShort = after.some(w => w.roomLow < 0 && b.payments.some(p => p.t >= w.start && p.t < w.end) && w.roomLow < base[w.i].roomLow);
  const summary = stillShort.length
    ? `${worseText(a, 'It would leave ')} ${!anyCover ? (fundSaved || otherSaved || activeGoals ? 'Nothing picked to cover it yet.' : '') : payShort ? 'What you picked doesn’t cover all of it.' : `That’s your goal needing a little more each ${u} to stay on its date.`} Alon keeps showing it so it isn’t a surprise twice.`
    : base.some(w => w.roomLow < 0) ? `Nothing gets shorter than it already was.` : `Every ${u} in the next six stays out of the red.`;
  return { valid: true, b, impact, impactRows: changedRows(mid), resultRows: changedRows(after), effects, summary, stillShort, fundSaved, otherSaved, activeGoals };
}
function rowsHtml(rows) {

/* The ways to cover it that are actually possible for this person right now. */

  state.draws = (state.draws || []).filter(d => d.surprise !== sid);
  if (!s) return;
  Object.entries(s.drawn || {}).forEach(([id, amt]) => { const g = state.goals.find(x => x.id === id); if (g) g.saved = (g.saved || 0) + amt; });
  Object.entries(s.skips || {}).forEach(([id, dates]) => { const g = state.goals.find(x => x.id === id); if (g) g.skips = (g.skips || []).filter(d => !dates.includes(d)); });

          <div class="field"><label for="ob-p-${i}-d">Next payment</label><input class="input" id="ob-p-${i}-d" type="date" data-obf="plans.${i}.next" value="${esc(x.next)}"></div>

    footer = foot(o.plans.length ? '' : `<button class="secondary" data-ob="skip">Nothing right now</button>`);
  } else if (st === 'everyday') {    body = q('About how much goes to everyday things each week?', 'Groceries, gas, the small stuff. A rough guess is fine. Without it, every forecast looks better than real life.') +

      `<section class="stack gap10 mt20">${choice('some', 'Yes, some', 'In savings, or cash you keep for this')}${choice('none', 'Not yet', 'You can start small here, or later')}</section>

        <fieldset style="border:0;padding:0;margin:0" class="stack gap8"><legend class="legend" style="margin-bottom:8px">${o.fund === 'some' ? `Add to it each ${u}?` : `Start one with a little each ${u}?`}</legend>
          <div class="chips">${[0, 10, 25, 50].map(v => `<button type="button" class="chip ${String(o.fundPer) === String(v) ? 'on' : ''}" aria-pressed="${String(o.fundPer) === String(v)}" data-obfundper="${v}">${v ? '$' + v : 'Not right now'}</button>`).join('')}</div></fieldset>
        <p class="small">${obNum(o.fundPer) > 0 ? `Alon counts ${money(obNum(o.fundPer))} as spoken for in each ${u}, so your forecast stays honest.` : 'Nothing is taken out of your forecast. You can change this anytime in Your goals.'}</p>

      ${OB_EXTRAS.filter(([k]) => k !== 'onhand' || obPaydayToday() || o.way === 'gig').map(([k, t, d]) => {
        const added = k === 'rare' ? o.rare.filter(b => obNum(b.amount) > 0).length : k === 'plans' ? o.plans.filter(b => obNum(b.each) > 0).length : k === 'cushion' ? (o.fund ? 1 : 0) : (obNum(o.onHand) != null && !o.skippedOnHand ? 1 : 0);
        return `<button class="more-toggle" style="border-style:solid;background:var(--white);min-height:64px" data-obextra="${k}"><span class="stack gap4"><span style="color:var(--navy)">${t}</span><span class="sum">${added ? (k === 'rare' || k === 'plans' ? `${added} added` : 'Added') : d}</span></span><span aria-hidden="true">${added ? '✓' : '›'}</span></button>`;
      }).join('')}
    </section>`;
    footer = `<div class="ob-foot"><button class="primary" data-ob="finish">Show me what’s coming</button></div>`;
  }
  return `${head}<main><div class="pad">${body}</div></main>${footer}`;
}
