  if (ds.action === 'save-plan') return savePlan();
  if (ds.action === 'remove-plan') { const f = state.planForm; state.bills = state.bills.filter(b => b.id !== f.id); state.planForm = null; toast(`${f.name} removed. Forecast updated.`); return go(state.planBack && state.planBack !== 'plan' ? state.planBack : 'bills'); }
  if (ds.paymode) { const f = state.screen === 'plan' ? null : state.form; if (f) f.plan = ds.paymode === 'parts' ? (f.plan || defaultPlanForm(f)) : null; return render(true); }
  if (ds.pfeekind || ds.pfeeof) {
    const fp = state.screen === 'plan' ? state.planForm : state.form.plan; if (!fp) return;
    if (ds.pfeekind) fp.feeKind = ds.pfeekind; else fp.feeOf = ds.pfeeof;
    return render(true);
  }
  if (ds.pparts || ds.pevery) {
    const fp = state.screen === 'plan' ? state.planForm : state.form.plan; if (!fp) return;
    if (ds.pparts) fp.parts = ds.pparts; else fp.every = ds.pevery;
    // a payday schedule that can't hold this many payments is cleared, not kept wrong
    if (ds.pparts && fp.every === 'paydays' && state.screen !== 'plan' && !paydayChoices(TODAY, primarySource(), Number(fp.parts))) fp.anchor = null;
    return render(true);
  }
  if (ds.pmode) {
    const fp = state.form && state.form.plan; if (!fp) return;
    if (ds.pmode === 'days') fp.every = 'days'; else { fp.every = 'paydays'; fp.anchor = ds.pmode; }
    return render(true);
  }

  if (ds.payday) {
    state.payAnswer = ds.payday;
    const pay = paydayEvent(computeWindows());
    if (ds.payday === 'yes' && pay) { state.actuals[pay.key] = pay.source.typical; toast(`Confirmed at ${money(pay.source.typical)}.`); return go('now'); }
    return render();
  }
  if (ds.action === 'confirm-pay') {
    const pay = paydayEvent(computeWindows());
    const v = parseMoney(state.draftRaw != null ? state.draftRaw : pay.source.typical);
    if (!(v > 0) || !pay) return;
    state.actuals[pay.key] = v; toast(`Confirmed at ${money(v)}. This paycheck is updated.`); return go('now');
  }

  if (ds.action === 'mobilize') { state.mobilized = !state.mobilized; state.reserves = []; toast(state.mobilized ? 'Showing the forecast if mobilized from Dec 26.' : 'Back to your current income.'); return render(); }
  if (ds.action === 'add-income') { state.incomeForm = incomeFormFrom(null); return go('income-edit'); }
  if (ds.editincome) { state.incomeForm = incomeFormFrom(state.sources.find(x => x.id === ds.editincome)); return go('income-edit'); }
  if (ds.ikind) { state.incomeForm.kind = ds.ikind; if (ds.ikind === 'variable' && !state.incomeForm.low) { state.incomeForm.low = state.incomeForm.amount; state.incomeForm.typical = state.incomeForm.amount; } if (ds.ikind !== 'variable' && !state.incomeForm.amount) state.incomeForm.amount = state.incomeForm.typical; return render(); }
  if (ds.ifreq) { state.incomeForm.freq = ds.ifreq; return render(); }
  if (ds.fromkeep !== undefined && state.form) { state.form.fromKeep = ds.fromkeep; return render(true); }
  if (ds.itype) {   // the kind picks the defaults; the person can change any of them
    const f = state.incomeForm, k = incomeKind(ds.itype); f.ikind = ds.itype;
    if (k && !f.id) { f.kind = k[2]; f.spread = k[3]; if (k[4]) { f.keepFor = k[4]; } if (!f.name.trim()) f.name = k[5]; if (k[0] === 'rental' || k[0] === 'benefits') f.freq = 'monthly'; if (k[0] === 'military') f.freq = 'monthly'; }
    return render(true);
  }
  if (ds.ispread !== undefined) { state.incomeForm.spread = Number(ds.ispread); return render(true); }
  if (ds.ikeep) { state.incomeForm.keepMode = ds.ikeep; return render(true); }
  if (ds.action === 'save-income') return saveIncome();
  if (ds.action === 'remove-income') {
    const f = state.incomeForm; if (!f || !f.id) return;
    state.sources = state.sources.filter(x => x.id !== f.id); state.picked = null; state.incomeForm = null;
    toast(`${f.name || 'Income'} removed. Forecast updated.`); return go('income');
  }
  if (ds.action === 'onhand') { state.why = null;
    state.sheet = { kind: 'onhand', title: 'What’s in your account now?', body: 'A rough number is fine. Alon counts it for the current stretch only, and asks again later.', amount: state.onHand != null && state.onHandDate === iso(TODAY) ? state.onHand : '', save: 'Save' };
    return render();
  }

  if (ds.editbill) return editBill(ds.editbill);
  if (ds.action === 'remove-bill') {
    const f = state.form; const b = f.id && state.bills.find(x => x.id === f.id);
    if (!b) return;
    state.bills = state.bills.filter(x => x.id !== b.id && x.of !== b.id); state.picked = null;   // its late fees go with it
    if (b.surprise) undoSurprise(b.surprise);
    const back = state.returnTo || 'now'; state.form = blankBillForm(); state.returnTo = null;
    toast(b.surprise ? `${b.name} removed. Any savings it used are back where they were.` : `${b.name} removed. Forecast updated.`); return go(back);
  }
  if (ds.confirm) {
    const b = state.bills.find(x => x.id === ds.confirm);
    state.sheet = { kind: 'bill', id: b.id, title: `Is ${money(b.amount)} still right for ${esc(b.name)}?`, body: 'Check your latest bill. Alon uses this amount for every future window.', amount: b.amount, save: 'Confirm amount' };
    return render();
  }
  if (ds.action === 'everyday-none') { state.everydayPerWeek = 0; state.everydayUnknown = false; state.sheet = null; toast('Nothing counted for everyday things.'); return render(); }
  if (ds.action === 'everyday-unsure') { state.everydayPerWeek = 0; state.everydayUnknown = true; state.sheet = null; toast('Amounts now say “before everyday spending.”'); return render(); }
  if (ds.action === 'everyday') {
    const w0 = computeWindows()[0];
    state.sheet = { kind: 'everyday', title: 'Everyday spending, per week', body: `Groceries, gas and other everyday things. A rough number is fine. Alon multiplies it by the days in each ${persona().unit === 'month' ? 'window' : persona().unit}: right now that's ${w0.days} days, so $${state.everydayPerWeek} a week becomes ~${money(w0.everyday)}.`, amount: state.everydayPerWeek, save: 'Save estimate' };
    return render();
  }
  if (ds.action === 'log') {
    state.sheet = { kind: 'log', title: 'What did you make today?', body: 'Tips, gig payouts, cash. Alon adds it to this week and to what you need for upcoming bills.', amount: '', save: 'Add to this week' };
    return render();
  }
  if (ds.action === 'sheet-save') {
    const v = parseMoney(document.getElementById('sheet-amt').value);
    if (!(v >= 0)) return;
    if (state.sheet.kind === 'bill') { const b = state.bills.find(x => x.id === state.sheet.id); b.amount = v; b.status = 'confirmed'; toast(`${b.name} confirmed at ${money(v)}.`); }
    else if (state.sheet.kind === 'onhand') { state.onHand = v; state.onHandDate = iso(TODAY); state.seq = (state.seq || 0) + 1; state.onHandAt = state.seq; toast('On-hand amount saved. Forecast updated.'); }
    else if (state.sheet.kind === 'pooladd') { if (v > 0) { poolState().adds.push({ id: 'pa' + Date.now(), from: state.sheet.from, amount: v, done: null }); toast(`${money(v)} planned for your tide pool from ${parse(state.sheet.from) === TODAY ? 'this ' + unitWord() : short(parse(state.sheet.from))}.`); } }
    else if (state.sheet.kind === 'poolbal') { poolState().balance = v; toast(`Tide pool set to ${money(v)}. Forecast updated.`); }
    else if (state.sheet.kind === 'log') { state.logged += v; toast(`${money(v)} added. ${money(state.logged)} logged this week.`); }
    else { state.everydayPerWeek = v; state.everydayUnknown = false; toast('Everyday estimate updated.'); }
    state.sheet = null; return render();
  }
  if (ds.action === 'close-sheet') { state.sheet = null; return render(); }

  if (ds.remove) {
    const b = state.bills.find(x => x.id === ds.remove);
    state.bills = state.bills.filter(x => x.id !== ds.remove);
    if (b.surprise) undoSurprise(b.surprise);
    state.reserves = []; state.picked = null;
    toast(`${b.name} removed. Forecast updated.`); return render();
  }
});

/* Typing updates state and only the numbers that depend on it, never the whole screen,
   so the cursor and phone keyboard stay put. */
app.addEventListener('change', e => {
  const el = e.target;
  if (el && el.dataset && el.dataset.restoreFile !== undefined && el.files && el.files[0]) readBackup(el.files[0]);
});
app.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.input === 'purchase') { state.purchase = parseMoney(el.value) || 0; state.purchaseRaw = el.value; state.purchaseTarget = null; refreshCheck(); }
  if (el.dataset.input === 'pname') { state.purchaseName = el.value; save(); }
  if (el.dataset.input === 'draft') {
    state.draftRaw = el.value;
    const ws = computeWindows(), pay = paydayEvent(ws);
    const v = parseMoney(el.value) || 0;
    const room = document.getElementById('draft-room');
    if (pay && room) room.textContent = money(v - pay.typ + ws[0].roomTyp);
    save();
  }
  if (el.dataset.obsplit !== undefined) { state.ob.rentSplit = el.checked; return render(true); }
  if (el.dataset.ckf && state.ck) { state.ck[el.dataset.ckf] = el.value; if (el.type === 'date') return render(true); return save(); }
  if (el.dataset.recentf) {
    const A = recentAnswers(), a = A[el.dataset.recentf] = A[el.dataset.recentf] || { ans: 'not' };
    a[el.dataset.rk] = el.value;
    if (el.type === 'date') return render(true);
    return state.screen === 'ob' ? refreshOb() : refreshBillForm();
  }
  if (el.dataset.obf) { obSet(el.dataset.obf, el.value); if (el.type === 'date' || el.tagName === 'SELECT') render(true); else refreshOb(); }
  if (el.dataset.gfield) { state.goalForm[el.dataset.gfield] = el.value; if (el.type === 'date') render(true); else refreshGoalForm(); }
  if (el.dataset.pfield) {
    const fp = state.screen === 'plan' ? state.planForm : state.form.plan;
    if (fp) { const [k, i] = el.dataset.pfield.split('.'); if (i != null) { fp[k] = (fp[k] || ['', '', '', '']).slice(); fp[k][Number(i)] = el.value; } else fp[k] = el.value; }
    if (el.type === 'date') return render(true);
    return state.screen === 'plan' ? refreshPlanForm() : refreshBillForm();
  }
  if (el.dataset.prep !== undefined) { state.prepAmt = Number(el.value); state.picked = null; document.querySelectorAll('[data-pick]').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); }); return refreshPrep(); }
  if (el.dataset.fbtext !== undefined) { state.fb.text = el.value; updateRail(); return save(); }
  if (el.dataset.owf) { state.ow[el.dataset.owf] = el.value; return refreshOw(); }
  if (el.dataset.scover) {
    const f = state.surpriseForm; f.cover[el.dataset.scover] = el.checked;
    if (el.dataset.scover === 'goals') f.goalsUse = null;
    if (el.dataset.scover === 'fund') f.fundUse = null;
    return render(true);
  }
  if (el.dataset.sfield) {
    state.surpriseForm[el.dataset.sfield] = el.value;
    if (el.dataset.sfield === 'due') render(true); else refreshSurprise();
  }
  if (el.dataset.gpause !== undefined) { state.goalForm.paused = el.checked; refreshGoalForm(); }
  if (el.dataset.ifield) {
    state.incomeForm[el.dataset.ifield] = el.value;
    if (el.dataset.ifield === 'start' || el.dataset.ifield === 'keepFor') render(true); else refreshIncomeForm();
  }
  if (el.dataset.field) {
    state.form[el.dataset.field] = el.value;
    if (el.dataset.field === 'due' || el.dataset.field === 'month') render(true); else refreshBillForm();
  }
});

function ask() {
  const input = document.getElementById('ask');
  const q = ((input && input.value) || '').toLowerCase().trim();
  if (!q) return;
  // the tutor first: how it works, and what a word means
  if (/how does (alon|this|it) work|how (do i|to) read|walk me through|show me around|tour|tutorial|explain (this|alon|the app)/.test(q)) { input.value = ''; state.railHint = false; if (state.screen !== 'now') go('now'); state.tour = 0; return render(false, true); }
  const termQ = /paychecks?,? not months|not by month|why (paychecks|weeks|windows)/.test(q) ? 'paycheck'
    : /(mean|what is|what's|whats|define)/.test(q) ? (/spoken/.test(q) ? 'spoken' : /\broom\b/.test(q) ? 'room' : /set aside|reserved/.test(q) ? 'reserved' : /\bleft\b/.test(q) ? 'left' : /estimate|~|tilde/.test(q) ? 'estimate' : /gr[ae]y|rough/.test(q) ? 'rough' : /covered|tight|short|colou?rs?|status/.test(q) ? 'status' : null) : null;
  if (termQ) { input.value = ''; state.termOpen = termQ; return render(); }
  if (/how am i doing|am i (ok|okay|good|fine)|how('?s| is) (it|everything|my money) (looking|going)|overview|where do i stand|what could (this|the|my) room|explore|extra room|more room/.test(q) && persona().unit === 'paycheck' && heroModel(computeWindows()[0])) {
    input.value = '';
    if (/room|explore/.test(q) && facts().money.state === 'OPPORTUNITY') { state.explore = true; return state.screen === 'now' ? render() : go('now'); }
    state.termOpen = 'state'; return render();
  }
  const amt = q.match(/\$?\s?(\d+(?:\.\d+)?)/);
  // someone already paying in parts: capture it, so the forecast is right
  if (/(i have|i'm on|i am on|i use|i signed up|already|i pay|i'm paying|i am paying).*(split|in parts|payment plan|pay in 4|pay-in-4|pay later|installment|advance|in two)/.test(q)) {
    const rent = /rent|mortgage/.test(q) && state.bills.find(b => /rent|mortgage/i.test(b.name) && b.freq !== 'once');
    if (rent) { editBill(rent.id); if (!state.form.plan) state.form.plan = defaultPlanForm(state.form); toast('Set how you split it, then Save.'); return render(true); }
    const kind = /advance|loan/.test(q) ? 'advance' : /pay in 4|pay-in-4|pay later|installment/.test(q) ? 'paylater' : 'plan';
    state.planForm = blankPlanForm(kind); state.planBack = state.screen; return go('plan');
  }
  // "I can't pay this, what can I do?" → an answer with the options, only because they asked
  if (/can'?t pay|cannot pay|can not pay|unable to pay|behind on|my options|what (are|can) .*options|help (with |paying)|can'?t afford|cannot afford|short on (rent|bills?)|payday loan|title loan|pay later|split (my |the )?(rent|bill)|they quoted|a quote|borrow/.test(q) && !/i (have|use|signed up|already)|i'm (on|paying)|i am (on|paying)/.test(q)) {
    state.askAnswer = { q: input.value.trim(), amount: amt ? Number(amt[1]) : 0, quote: /quot|fee/.test(q) };
    state.askBack = state.screen === 'options' ? (state.askBack || 'now') : state.screen;
    if (state.screen === 'options') { state.ow.amount = null; state.ow.open = null; return render(false, true); }
    return go('options');
  }
  if (/sinking|set aside|save up for/.test(q)) { state.learnOpen = Object.assign({}, state.learnOpen, { sinking: true }); return go('why'); }
  if (/tide pool|carry (it |some )?forward|extra money|leftover/.test(q)) return go('pool');
  if (/emergency fund|surprise fund|rainy/.test(q)) { state.learnOpen = Object.assign({}, state.learnOpen, { fund: true }); return go('goals'); }
  const kindQ = /\bcar\b|engine|brake|tire|transmission|mechanic/.test(q) ? 'car' : /medical|hospital|doctor|dentist|er visit|surgery|prescription/.test(q) ? 'medical' : /hvac|furnace|\bac\b|air condition|heat|pipe|leak|plumb|roof|water heater|house|home/.test(q) ? 'home' : null;
  if (kindQ && /repair|broke|bill|fix|unexpected|need|came up|emergency|replace|burst|\bout\b/.test(q) || /unexpected|emergency|came up|surprise bill/.test(q)) {
    state.surpriseBack = 'now'; state.surpriseForm = freshSurpriseForm(kindQ);
    if (amt) state.surpriseForm.amount = amt[1];
    return go('surprise');
  }
  if (/tax/.test(q)) { state.learnOpen = Object.assign({}, state.learnOpen, { taxes: true }); return go('bills'); }
  if (/why|short|tight|rough|gap|negative|minus|dec|jan/.test(q)) {
    const ws = whyWindows();
    // a date they named ("why is Dec 25 short?"), else the next short paycheck, else the first tight one
    const named = ws.findIndex(w => q.includes(short(w.start).toLowerCase()));
    let i = named >= 0 ? named : nextShort(ws);
    if (i < 0) i = ws.findIndex(w => w.roomLow < 0);
    if (i < 0) i = ws.findIndex(w => w.status === 'Tight');
    if (input) input.value = '';
    return i >= 0 ? openWhy(i) : go('why');
  }
  if (/afford|buy|spend|purchase|cost/.test(q)) { if (amt) { state.purchase = Number(amt[1]); state.purchaseRaw = amt[1]; } return go('check'); }
  if (/income|paid|pay|mobiliz|drill/.test(q)) return go('income');
  if (/add|bill|insurance|registration/.test(q)) return go('add');
  if (/upcoming|next|forecast|week|month/.test(q)) return go('waves');
  toast('Alon can’t answer that one yet. Try “why is Dec 25 short?”, “what can I spend?” or “my car broke down.”');
}

/* Forms never submit (some previews block form submission); buttons and Enter call the same functions. */
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'ask') ask();
  if (e.target.dataset.form === 'bill') saveBill();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (state.sheet || state.why || state.termOpen || state.review || state.tour != null || state.menuOpen)) { state.sheet = null; state.why = null; state.termOpen = null; state.review = false; state.tour = null; state.menuOpen = false; render(); return; }
  if (e.key !== 'Enter' || !e.target.closest) return;
  const form = e.target.closest('form');
  if (e.target.id === 'sheet-amt') { e.preventDefault(); document.querySelector('[data-action="sheet-save"]').click(); return; }
  if (!form || e.target.tagName !== 'INPUT') return;
  e.preventDefault();
  if (form.dataset.form === 'ask') ask();
  if (form.dataset.form === 'bill') saveBill();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.ifield) { e.preventDefault(); saveIncome(); }
  if (e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.obf && obValid()) { e.preventDefault(); obClick({ ob: 'next' }); }
  if (e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.gfield) { e.preventDefault(); saveGoal(); }
  if (e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.sfield) { e.preventDefault(); saveSurprise(); }
  if (e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.pfield && state.screen === 'plan') { e.preventDefault(); savePlan(); }
});

load();
render();
fbFlush();
document.addEventListener('scroll', e => { if (e.target && e.target.id === 'wave-scroll') waveEdges(); }, true);
</script>
</body>
</html>
